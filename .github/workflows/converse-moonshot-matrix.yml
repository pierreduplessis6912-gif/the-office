name: Moonshot front door matrix (staging, real models)

# Runs the Moonshot front door matrix (CONVERSATIONAL_LAYER.md) with the REAL models on STAGING: seeds a little staging data, runs the phrases through the old pipeline once, then through each configuration (model, thinking, policy) chosen per
# request with a header the Worker honours only on staging, and records routing, replies, time and tokens in ops/converse-moonshot-matrix-last.json. Staging credentials only, never production; synthetic messages only.
# Started by hand only; the staging Worker must already hold the Moonshot key (staging-moonshot-key.yml) and run the branch under test (staging.yml on that branch, AFTER the key was set).
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "The full commit staging must be running (the run fails if /health says otherwise)"
        required: true
      configs:
        description: "Optional JSON list of {model, thinking}; empty runs kimi-k2.6 off and on, kimi-k2.7-code and kimi-k2.7-code-highspeed, each under Policy A and Policy B"
        required: false
        default: ""
      record:
        description: "File name under ops/ for this run's record (a new name keeps an earlier run's evidence intact)"
        required: false
        default: "converse-moonshot-matrix-last.json"
      policies:
        description: "A, B or A,B"
        required: false
        default: "A"
      probe_only:
        description: "1 = only check whether the Moonshot front door is active (after the key was removed it must not be)"
        required: false
        default: ""
      samples:
        description: "Samples per phrase"
        required: false
        default: "3"

concurrency:
  group: converse-moonshot-matrix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SEED: ${{ secrets.STAGING_KEY_SEED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECT_COMMIT: ${{ inputs.expect_commit }}
      CONFIGS: ${{ inputs.configs }}
      SAMPLES: ${{ inputs.samples }}
      POLICIES: ${{ inputs.policies }}
      PROBE_ONLY: ${{ inputs.probe_only }}
      RECORD: ${{ inputs.record }}
      OUT: ${{ github.workspace }}/converse-moonshot-matrix-result.json
    steps:
      - uses: actions/checkout@v4
      - name: Run the smoke test
        id: run
        continue-on-error: true
        run: python3 tools/converse-moonshot-matrix.py
      - name: Record the result on main
        run: |
          mkdir -p ops
          cp "$OUT" "ops/$RECORD"
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add "ops/$RECORD"
          git commit -q -m "Moonshot front door matrix record (staging; plain facts and replies to synthetic messages)" || true
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Fail the run if the evaluation did not run
        if: steps.run.outcome != 'success'
        run: exit 1
