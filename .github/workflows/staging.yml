          # A CUSTOMER STARTS A PAYMENT ON THEIR OWN (worker/src/plans.ts) on the REAL objects. The business is first put in a cancelled state (it may subscribe again). The owner asks for a plans link and nobody else can; the page lists the plans from the
          # real price table; a tampered link is refused; the form (with a made-up business and amount injected) makes an order for the SIGNED link's business at OUR price and sends the owner to the signed PayFast page; and once the business has a
