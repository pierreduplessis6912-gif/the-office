          # THE CARD-UPDATE PAGE (worker/src/plans.ts) on the REAL objects. PayFast's own SDK refuses to build the card-update link in sandbox, and this business's stored reference here is not a real PayFast token, so what the real objects can prove is the REFUSALS:
