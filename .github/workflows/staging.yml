          printf '%sInvoice No.;Customer Name;Amount (incl. VAT);Balance;Invoice Date\n%s-1;Import Client %s;R1 500,00;R0,00;2026-10-01\n%s-2;Import Client %s;R2 300,50;R2 300,50;2026-10-02\n' "$BOM" "$TAG" "$TAG" "$TAG" "$TAG" > "$RESULTS/invoices.csv"
          printf 'Customer,Total\nNobody,100\n' > "$RESULTS/unknown-paid.csv"
          # A list of four DIFFERENT people with look-alike names (this run's tag keeps them new): only an EXACT name matches; the look-alikes must stay separate customers and be reported, not folded into each other.
          printf 'Name\nMrs Nkosi %s\nMr Nkosi %s\nJohn Smithson %s\nJohn Smith %s\n' "$TAG" "$TAG" "$TAG" "$TAG" > "$RESULTS/lookalikes.csv"
          upload /files/team-csv-import team.csv imp-team-1.json;           upload /files/team-csv-import team.csv imp-team-2.json
          upload /files/suppliers-csv-import suppliers.csv imp-sup-1.json;   upload /files/suppliers-csv-import suppliers.csv imp-sup-2.json
          upload /files/products-csv-import products.csv imp-pro-1.json;     upload /files/products-csv-import products.csv imp-pro-2.json
          upload /files/invoices-csv-import invoices.csv imp-inv-1.json;     upload /files/invoices-csv-import invoices.csv imp-inv-2.json
          upload /files/invoices-csv-import unknown-paid.csv imp-inv-refused.json
          upload /files/customers-csv-import lookalikes.csv imp-cust-1.json;   upload /files/customers-csv-import lookalikes.csv imp-cust-2.json
          get /onboarding ob-final.json
          python3 - <<'PY' > "$RESULTS/onboarding.json"
          import json, os
          r = os.environ["RESULTS"]
          def read(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return None
          def status(n):
              try:
                  return open(os.path.join(r, n + ".status")).read().strip()
              except Exception:
                  return None
          st, after, final = read("ob-state.json") or {}, read("ob-after-skip.json") or {}, read("ob-final.json") or {}
          step = lambda doc, i: next((x for x in (doc.get("steps") or []) if x.get("id") == i), {})
          ids = ["profile", "customers", "invoices", "team", "suppliers", "products", "try_it"]
          s1, s2, rs = read("ob-skip1.json"), read("ob-skip2.json"), read("ob-reset.json") or {}
          i1, i2, ir = read("imp-inv-1.json") or {}, read("imp-inv-2.json") or {}, read("imp-inv-refused.json") or {}
          pair = lambda a, b: (read("imp-%s-1.json" % a) or {}, read("imp-%s-2.json" % a) or {})
          t1, t2 = pair("team", 0); u1, u2 = pair("sup", 0); p1, p2 = pair("pro", 0); k1, k2 = pair("cust", 0)
          prof = step(after, "profile")
          out = {
              "onboarding_read_ok": status("ob-state.json") == "200" and [x.get("id") for x in st.get("steps", [])] == ids,
              "steps_name_their_upload_route": [x.get("upload") for x in st.get("steps", [])] == [None, "/files/customers-csv-import", "/files/invoices-csv-import", "/files/team-csv-import", "/files/suppliers-csv-import", "/files/products-csv-import", None],
              "signed_out_is_refused": status("ob-anon") == "401",
              "marking_a_step_works_and_persists": status("ob-skip1.json") == "200" and (prof.get("status") == "skipped" or (prof.get("status") == "done" and prof.get("source") == "data")),
              "marking_twice_is_the_same_as_once": s1 is not None and s1 == s2,
              "resetting_a_step_works": status("ob-reset.json") == "200" and step(rs, "profile").get("status") in ("pending", "done"),
              "a_bad_step_is_refused": status("ob-bad.json") == "400",
              "team_import_created_then_matched": status("imp-team-1.json") == "200" and t1.get("created") == 2 and t1.get("matched") == 0 and t2.get("created") == 0 and t2.get("matched") == 2,
              "team_roles_were_read": (t1.get("columns") or {}).get("found", {}).get("role") == "Role",
              "suppliers_import_created_then_matched": u1.get("created") == 2 and u2.get("created") == 0 and u2.get("matched") == 2,
              "products_import_created_then_matched": p1.get("created") == 2 and p2.get("created") == 0 and p2.get("matched") == 2,
