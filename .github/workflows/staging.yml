          rec status-end "$RESULTS/pp-status-end.json" "${A[@]}" "$BASE/admin/engine/status"
          python3 - <<'PY' > "$RESULTS/parties-proof.json"
          import json, os
          r = os.environ["RESULTS"]
          def load(n):
              try: return json.load(open(os.path.join(r, n)))
              except Exception: return {}
          log = {}
          for line in open(os.path.join(r, "pp-log.tsv")):
              k, _, v = line.rstrip("\n").partition("\t"); log[k] = v
          res = lambda n: (load(n).get("result") or {})
          parties = lambda n: res(n).get("parties") or []
          rec = res("pp-record-final.json")
          hist = [h.get("type") for h in (rec.get("history") or [])]
          st0, st1 = load("pp-status-start.json"), load("pp-status-end.json")
          c = {}
          c["the_object_is_in_engine_mode_with_the_party_capabilities"] = load("pp-status-ready.json").get("mode") == "engine" and all(x in (load("pp-status-ready.json").get("available") or []) for x in ["parties.find", "party.create", "party.edit"])
          c["finding_a_name_that_is_not_there_is_an_honest_empty_answer"] = log.get("find-before") == "200" and parties("pp-find-before.json") == []
          c["proposing_a_new_customer_is_held"] = log.get("propose-create") == "200" and load("pp-propose-create.json").get("status") == "held"
          c["a_held_proposal_records_no_party"] = log.get("find-while-held") == "200" and parties("pp-find-held.json") == []
          c["approving_it_records_the_party"] = log.get("confirm-create") == "200" and len(parties("pp-find-created.json")) == 1
          c["a_duplicate_name_is_refused"] = log.get("propose-duplicate") == "409" and load("pp-duplicate.json").get("error") == "duplicate"
          c["a_rename_is_held_then_approved"] = log.get("propose-rename") == "200" and log.get("confirm-rename") == "200"
          c["finding_uses_the_current_name"] = log.get("find-renamed") == "200" and len(parties("pp-find-renamed.json")) == 1
          c["the_record_keeps_both_facts_in_its_history"] = "party.created" in hist and "party.revised" in hist
          c["an_edit_approved_after_the_record_changed_is_stale"] = log.get("confirm-edit-2") == "200" and log.get("confirm-edit-1-stale") == "409" and load("pp-confirm-edit1.json").get("error") == "stale"
          c["a_contact_field_can_be_cleared"] = next((f.get("value") for f in (rec.get("fields") or []) if f.get("key") == "phone"), "x") is None
          c["an_installer_is_refused_a_read_and_a_proposal"] = log.get("installer-find") == "403" and log.get("installer-propose") == "403"
          c["the_integrity_verifier_is_clean_at_the_end"] = (st1.get("integrity") or {}).get("ok") is True
          out = {"when": __import__("datetime").datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7], "mode": "parties-proof", "business": "staging-parties",
                 "started_in": {"mode": st0.get("mode"), "rows": st0.get("rows")}, "http": log, "checks": c, "passed": all(c.values()), "failed": [k for k, v in c.items() if not v]}
          print(json.dumps(out, indent=1))
          PY
          cat "$RESULTS/parties-proof.json"
          mkdir -p ops
          cp "$RESULTS/parties-proof.json" ops/staging-parties-proof-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts 2>/dev/null
          git add ops/staging-parties-proof-last.json
          git commit -m "Staging customers and suppliers proof record (statuses, checks and pass or fail only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$RESULTS/parties-proof.json'))['passed'] else 1)"

      - name: Quotations proof (mode quotations-proof, the dedicated staging business staging-quotes only)
