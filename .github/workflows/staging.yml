          # THE OWNER'S READ-ONLY KEYS for outside assistants (worker/src/mcp-keys.ts) on the REAL objects. OWNER ONLY: a second member and a stranger are refused. The owner issues a key (shown once), lists it (never a hash or a secret), cannot issue one for someone who is not an active member, and revokes it. The raw answers stay in the runner's temporary folder and only true or false is recorded: the key never reaches a log or a record.
