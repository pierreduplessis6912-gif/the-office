          # Each run uses its OWN PayFast payment ids (the staging database persists between runs, and a payment id is remembered for good: reusing one is correctly treated as a replay).
          itn_body() { python3 - "$@" <<'PY'
          import hashlib, sys, urllib.parse
          order, pf, status, amount, biz, token, kind = sys.argv[1:8]
          enc = lambda s: urllib.parse.quote_plus(s, safe="").replace("~", "%7E")
