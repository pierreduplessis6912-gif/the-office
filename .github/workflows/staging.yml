          COOKIE=$(cat "$RESULTS/cookie.txt")
          setplan() { curl -s -X POST "${A[@]}" -H "Content-Type: application/json" -d "{\"name\":\"standard\",\"messagesPerMemberPerDay\":$1,\"neuronsPerBusinessPerDay\":$2,\"mode\":\"$3\"}" "$BASE/debug/directory/plans/set" > "$RESULTS/caps-set-$4.json"; }
          health() { curl -s "$BASE/admin/health" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" > "$RESULTS/$1"; }
          send() { curl -s -D "$RESULTS/$1.headers" -o "$RESULTS/$1.json" -w '%{http_code}' -X POST "$BASE/messages/text" -H "Cookie: $COOKIE" -H "Content-Type: application/json" -d "{\"text\":\"What is the total of my unpaid invoices?\",\"idempotency_key\":\"caps-$1-${GITHUB_RUN_ID}\"}" > "$RESULTS/$1.status"; }
          curl -s "${A[@]}" "$BASE/debug/directory/plans" > "$RESULTS/caps-plans-before.json"
          # 1. ENFORCE with a limit of 1 message a day: the owner has already sent a real sentence today, so the next one must be refused BEFORE the model is called.
          setplan 1 400000 enforce enforce
          health caps-health-0.json
          send caps-blocked
          health caps-health-1.json
          # 2. WARN with the same limit: the same message must go through, with a warning header.
          setplan 1 400000 warn warn
          send caps-warned
          sleep 8
          health caps-health-2.json
          # 3. Put the plan back to the starting one.
          setplan 100 400000 warn restore
          curl -s "${A[@]}" "$BASE/debug/directory/plans" > "$RESULTS/caps-plans-after.json"
          python3 - <<'PY' > "$RESULTS/caps.json"
          import json, os
          r = os.environ["RESULTS"]
          def load(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return {}
          def text(n):
              try:
                  return open(os.path.join(r, n)).read().strip()
              except Exception:
                  return ""
          h0, h1, h2 = load("caps-health-0.json"), load("caps-health-1.json"), load("caps-health-2.json")
          m = lambda h, k: ((h.get("model") or {}).get("today") or {}).get(k) or 0
          blocked_body = load("caps-blocked.json")
          warned_headers = text("caps-warned.headers").lower()
          plans_after = [p for p in (load("caps-plans-after.json").get("plans") or []) if p.get("name") == "standard"]
          print(json.dumps({
              "enforce_status": text("caps-blocked.status"), "enforce_body": {k: blocked_body.get(k) for k in ("capped", "reason", "limit", "used", "resetsInSeconds")},
              "enforce_blocked_with_429": text("caps-blocked.status") == "429" and blocked_body.get("capped") is True and blocked_body.get("reason") == "messages",
              "retry_after_header_present": "retry-after:" in text("caps-blocked.headers").lower(),
              "the_model_was_NOT_called_when_blocked": m(h0, "neurons") == m(h1, "neurons") and m(h0, "requests") == m(h1, "requests"),
              "warn_status": text("caps-warned.status"), "warn_let_it_through": text("caps-warned.status") == "200",
              "warn_header_present": "x-usage-warning: daily-message-limit" in warned_headers,
              "the_model_WAS_called_in_warn_mode": m(h2, "neurons") > m(h1, "neurons"),
              "health_shows_a_member_at_the_limit": (h2.get("limits") or {}).get("membersAtOrOverLimit", 0) >= 1,
              "limits_in_health": h2.get("limits"),
              "plan_restored": bool(plans_after) and plans_after[0].get("messagesPerMemberPerDay") == 100 and plans_after[0].get("mode") == "warn",
          }))
          PY

      - name: Load test the business objects on Cloudflare (staging only)
        if: env.MODE == 'load'
        id: load
        continue-on-error: true
        env:
          LOAD_SENTENCES: ${{ github.event.inputs.load_sentences || '5' }}
        run: |
          mkdir -p "$RESULTS"
          cat > "$RESULTS/mkcookie.py" <<'PY'
          import os, json, hmac, hashlib, base64, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          body = {"email": os.environ["EMAIL"], "exp": int(time.time() * 1000) + 3600000, "b": os.environ["BIZ"]}
          p = b(json.dumps(body, separators=(",", ":")).encode())
          s = b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest())
          print("office_session=" + p + "." + s)
          PY
          COOKIE_A=$(EMAIL="staging-owner@example.com" BIZ="staging-co" python3 "$RESULTS/mkcookie.py")
          COOKIE_B=$(EMAIL="staging-two-owner@example.com" BIZ="staging-two" python3 "$RESULTS/mkcookie.py")
          echo "::add-mask::$COOKIE_A"; echo "::add-mask::$COOKIE_B"
          # The script itself refuses any host that is not staging (office-staging.*): production cannot be reached from here.
          LOAD_HOST="${SLUG}.websitehub.co.za" COOKIE_A="$COOKIE_A" COOKIE_B="$COOKIE_B" ADMIN_KEY="$STAGING_ADMIN_KEY" python3 tools/load-test.py > "$RESULTS/load.json" 2> "$RESULTS/load.err"
          echo "load test exit $?"; tail -n 5 "$RESULTS/load.err" || true

      - name: Load test verdict
        if: always() && env.MODE == 'load'
        run: |
          set +e
          python3 tools/load-judge.py "$RESULTS/load.json" > "$RESULTS/load-verdict.json"
          JUDGED=$?
          python3 tools/load-judge.py "$RESULTS/load.json" --markdown >> "$GITHUB_STEP_SUMMARY"
          cat "$RESULTS/load-verdict.json"
          exit $JUDGED

      - name: Record the load test
        if: always() && env.MODE == 'load'
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, datetime
          r = os.environ["RESULTS"]
          def read(name):
              try:
                  return json.load(open(os.path.join(r, name)))
              except Exception:
                  return None
          out = {"when": datetime.datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7], "mode": "load",
                 "verdict": read("load-verdict.json"), "measurements": read("load.json")}
          json.dump(out, open("ops/load-test-last.json", "w"), indent=1)
          PY
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git add ops/load-test-last.json
          git commit -m "Load test record (numbers only, no secrets)" || echo "nothing to record"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Make the owner of staging
        if: env.MODE == 'rehearsal' && github.event.inputs.owner_email != ''
        run: |
          curl -s -X POST "https://${SLUG}.websitehub.co.za/debug/create-membership" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "Content-Type: application/json" -d "{\"google_email\": \"${{ github.event.inputs.owner_email }}\", \"role\": \"owner\"}"

      - name: Record what happened
        if: always() && env.MODE == 'rehearsal'
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
          KV_ID: ${{ steps.kv.outputs.id }}
          SMOKE: ${{ steps.smoke.outcome }}
          INIT: ${{ steps.init.outcome }}
          TRIAL: ${{ steps.trial.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          SENTENCE: ${{ steps.sentence.outcome }}
          BUSINESSES: ${{ steps.businesses.outcome }}
          VECTORS: ${{ steps.vectors.outcome }}
          MODEL: ${{ steps.model.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          ONBOARDING: ${{ steps.onboarding.outcome }}
          SIGNUP: ${{ steps.signup.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          CAPS: ${{ steps.caps.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          TX: ${{ steps.tx.outcome }}
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, datetime
          r = os.environ["RESULTS"]
          def read(name):
              try:
                  return open(os.path.join(r, name)).read().strip()
              except Exception:
                  return None
          def readjson(name):
              t = read(name)
              try:
                  return json.loads(t) if t else None
              except Exception:
                  return t
          out = {
              "when": datetime.datetime.utcnow().isoformat() + "Z",
              "run": os.environ.get("GITHUB_RUN_ID"),
              "commit": os.environ.get("GITHUB_SHA", "")[:7],
              "resources": {"database_id": os.environ.get("D1_ID"), "kv_namespace_id": os.environ.get("KV_ID"), "worker": "office-staging-api", "host": "office-staging.websitehub.co.za"},
              "outcomes": {"smoke_test": os.environ.get("SMOKE"), "schema_and_indexes": os.environ.get("INIT"), "trial": os.environ.get("TRIAL"), "business_object_e2e": os.environ.get("E2E"), "real_sentence": os.environ.get("SENTENCE"), "businesses_created": os.environ.get("BUSINESSES"), "signup_on_cloudflare": os.environ.get("SIGNUP"), "memory_index_probe": os.environ.get("VECTORS"), "model_probe": os.environ.get("MODEL"), "backup_restore": os.environ.get("BACKUP"), "onboarding_imports": os.environ.get("ONBOARDING"), "health_report": os.environ.get("HEALTH"), "cost_caps": os.environ.get("CAPS"), "schema_migration": os.environ.get("SCHEMA"), "transaction_experiment": os.environ.get("TX")},
              "init_routes": (read("init.txt") or "").splitlines(),
              "indexes": readjson("indexes.json"),
              "trial_do": readjson("trial-do.json"),
              "trial_d1": readjson("trial-d1.json"),
              "businesses": readjson("businesses.json"),
              "business_object_e2e": readjson("e2e.json"),
              "memory_index_probe": readjson("vectors.json"),
              "model_probe": readjson("model.json"),
              "backup_restore": readjson("backup.json"),
              "onboarding_imports": readjson("onboarding.json"),
              "signup_on_cloudflare": readjson("signup.json"),
              "health_report": readjson("health.json"),
              "cost_caps": readjson("caps.json"),
              "schema_migration": readjson("schema.json"),
              "transaction_experiment": readjson("tx.json"),
              "real_sentence": readjson("sentence.json"),
          }
          json.dump(out, open("ops/staging-last-run.json", "w"), indent=1)
          PY
          # The temporary schema step regenerated a TRACKED file in this workspace (worker/src/schema-steps.ts) and added a migration file that must never be committed. Put both back FIRST: git refuses to
          # rebase over unstaged changes, which is what failed the first run of the schema rehearsal and lost its results.
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts
          rm -f worker/migrations/*_staging_probe.sql
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git add ops/staging-last-run.json
          git commit -m "Staging run record (no secrets: ids and results only)" || echo "nothing to record"
          # Record on the branch the run was STARTED from (main for every run the pipeline makes, so nothing changes there). A rehearsal of an unmerged branch must never push that branch's code to main: main deploys to production.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
