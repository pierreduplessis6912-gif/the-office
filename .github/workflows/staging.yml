      - name: Starting a business from the app on Cloudflare (a signup proof, a real Durable Object)
        if: env.MODE == 'rehearsal'
        id: signup
        continue-on-error: true
        run: |
          # The page itself needs a real Google sign-in, which a runner cannot do. What CAN be done for real: mint the signed proof the page carries (the staging session secret is derived in this workflow), post the form to the real
          # staging Worker, and check the real D1, the real Durable Object, the real session and the real routing. Caps are raised in the staging config so repeated rehearsals from one runner address are not refused.
          BASE="https://${SLUG}.websitehub.co.za"
          TAG="r${GITHUB_RUN_ID}"
          EMAIL="signup-owner-${TAG}@example.com"
          proof() {
            python3 - "$1" <<'PY'
          import base64, hashlib, hmac, json, os, sys, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          p = b(json.dumps({"purpose": "signup", "email": sys.argv[1], "exp": int(time.time() * 1000) + 600000}, separators=(",", ":")).encode())
          print(p + "." + b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), ("signup." + p).encode(), hashlib.sha256).digest()))
          PY
          }
          form() { curl -s -D "$RESULTS/$1.headers" -o "$RESULTS/$1.body" -w '%{http_code}' -X POST --data-urlencode "token=$2" --data-urlencode "business_name=$3" ${4:+--data-urlencode "agree=on"} "$BASE/auth/signup" > "$RESULTS/$1.status"; }
          form su-first "$(proof "$EMAIL")" "Signup Floors $TAG" yes
          form su-again "$(proof "$EMAIL")" "A Different Name $TAG" yes
          form su-garbage "garbage" "Nobody $TAG" yes
          form su-untick "$(proof "untick-${TAG}@example.com")" "Untick Co $TAG"
          SESSION=$(python3 -c "import re,sys,urllib.parse as u; h=open('$RESULTS/su-first.headers').read(); m=re.search(r'(?im)^location:\\s*(\\S+)', h); print(u.parse_qs(u.urlparse(m.group(1)).query).get('token',[''])[0] if m else '')")
          J=(-H "Cookie: office_session=$SESSION")
          curl -s -o "$RESULTS/su-me.json" "${J[@]}" "$BASE/auth/me"
          curl -s -o "$RESULTS/su-customers.json" -w '%{http_code}' "${J[@]}" "$BASE/customers" > "$RESULTS/su-customers.status"
          curl -s -o "$RESULTS/su-onboarding.json" -w '%{http_code}' "${J[@]}" "$BASE/onboarding" > "$RESULTS/su-onboarding.status"
          curl -s -o "$RESULTS/su-directory.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory"
          curl -s -o "$RESULTS/su-plans.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory/plans"
          # Bringing a trial back (worker/src/freetrial.ts): extend it by 7 days, convert it to the standard plan, be refused a repeat, and be refused without the confirmation key.
          BID=$(python3 -c "import json; print(next((b['id'] for b in json.load(open('$RESULTS/su-directory.json')).get('businesses', []) if b.get('name') == 'Signup Floors $TAG'), ''))")
          trial() { curl -s -o "$RESULTS/$1.json" -w '%{http_code}' -X POST -H "X-Admin-Key: $STAGING_ADMIN_KEY" ${3:+-H "X-Admin-Confirm: $STAGING_CONFIRM_KEY"} -H "Content-Type: application/json" -d "$2" "$BASE/debug/directory/trial" > "$RESULTS/$1.status"; }
          dirnow() { curl -s -o "$RESULTS/$1.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory"; }
          trial tr-nokey "{\"business\":\"$BID\",\"action\":\"extend\",\"days\":7}"
          trial tr-extend "{\"business\":\"$BID\",\"action\":\"extend\",\"days\":7}" yes
          dirnow su-directory-extended
          trial tr-convert "{\"business\":\"$BID\",\"action\":\"convert\",\"plan\":\"standard\"}" yes
          dirnow su-directory-converted
          trial tr-again "{\"business\":\"$BID\",\"action\":\"convert\",\"plan\":\"standard\"}" yes
          trial tr-bad "{\"business\":\"$BID\",\"action\":\"delete\"}" yes
          python3 - <<'PY'
          import base64, datetime, json, os, re, sys, urllib.parse as u
          r, tag = os.environ["RESULTS"], "r" + os.environ["GITHUB_RUN_ID"]
          def rd(n, js=True):
              try:
                  t = open(os.path.join(r, n)).read()
                  return json.loads(t) if js else t
              except Exception:
                  return None
          def location(n):
              m = re.search(r"(?im)^location:\s*(\S+)", rd(n + ".headers", False) or "")
              return u.urlparse(m.group(1)) if m else None
          status = lambda n: (rd(n + ".status", False) or "").strip()
          loc = location("su-first"); q = u.parse_qs(loc.query) if loc else {}
          token = (q.get("token") or [""])[0]
          payload = {}
          try:
              payload = json.loads(base64.urlsafe_b64decode(token.split(".")[0] + "=="))
          except Exception:
              pass
          listing = (rd("su-directory.json") or {}).get("businesses") or []
          mine = [b for b in listing if b.get("name") == "Signup Floors " + tag]
          biz = mine[0] if mine else {}
          ends = None
          try:
              ends = datetime.datetime.strptime(biz.get("trial_ends_at"), "%Y-%m-%d %H:%M:%S").replace(tzinfo=datetime.timezone.utc)
          except Exception:
              pass
          days = (ends - datetime.datetime.now(datetime.timezone.utc)).total_seconds() / 86400 if ends else None
          plans = {p["name"]: p for p in (rd("su-plans.json") or {}).get("plans", [])}
          def mine_in(n):
              return next((b for b in ((rd(n) or {}).get("businesses") or []) if b.get("name") == "Signup Floors " + tag), {})
          def when(t):
              try:
                  return datetime.datetime.strptime(t, "%Y-%m-%d %H:%M:%S").replace(tzinfo=datetime.timezone.utc)
              except Exception:
                  return None
          ext_end, ext_start = when(mine_in("su-directory-extended.json").get("trial_ends_at")), ends
          conv = mine_in("su-directory-converted.json")
          again = location("su-again"); again_q = u.parse_qs(again.query) if again else {}
          cust = rd("su-customers.json"); cust_list = cust.get("items") if isinstance(cust, dict) else cust   # GET /customers answers {"items": [...], "limit", "offset"}
          ob = rd("su-onboarding.json") or {}
          steps = ob.get("steps") if isinstance(ob, dict) else None
          me = rd("su-me.json") or {}
          out = {
              "first_form_ends_in_the_apps_own_address": status("su-first") == "303" and loc is not None and loc.scheme == "theoffice" and (q.get("role") or [""])[0] == "owner" and bool(token),
              "exactly_one_business_was_created_even_after_a_second_tap": len(mine) == 1 and status("su-again") == "303" and again is not None and again.scheme == "theoffice",
              "it_is_active_on_the_trial_plan_and_marked_as_started_by_its_owner": biz.get("status") == "active" and biz.get("plan") == "trial" and biz.get("source") == "signup" and biz.get("members") == 1,
              "its_trial_ends_in_about_14_days": days is not None and 13.9 < days < 14.1,
              "the_session_is_for_that_business_and_ends_with_the_trial": payload.get("b") == biz.get("id") and ends is not None and abs(payload.get("exp", 0) / 1000 - ends.timestamp()) < 3,
              "the_trial_plan_exists_with_the_small_limits_enforced": plans.get("trial", {}).get("messagesPerMemberPerDay") == 30 and plans.get("trial", {}).get("neuronsPerBusinessPerDay") == 60000 and plans.get("trial", {}).get("mode") == "enforce",
              "the_new_owner_is_an_owner_inside_the_business_object": me.get("signedIn") is True and me.get("role") == "owner",
              "it_is_a_blank_business_with_its_journey_waiting": status("su-customers") == "200" and cust_list == [] and status("su-onboarding") == "200" and isinstance(steps, list) and len(steps) == 7 and not any(s.get("status") == "done" for s in steps),
              "a_garbage_token_is_refused_with_a_page_and_creates_nothing": status("su-garbage") == "400" and "took too long" in (rd("su-garbage.body", False) or "") and not any(b.get("name") == "Nobody " + tag for b in listing),
              "an_unticked_box_is_refused_with_a_page_and_creates_nothing": status("su-untick") == "400" and "tick the box" in (rd("su-untick.body", False) or "") and not any(b.get("name") == "Untick Co " + tag for b in listing),
              "the_trial_route_refuses_without_the_confirmation_key": status("tr-nokey") not in ("200", "") and ext_end is not None and ext_start is not None and ext_end > ext_start,
              "extending_a_trial_moves_its_end_later_by_the_days_asked": status("tr-extend") == "200" and ext_end is not None and ext_start is not None and abs((ext_end - ext_start).total_seconds() - 7 * 86400) < 120,
              "converting_clears_the_trial_and_sets_the_plan": status("tr-convert") == "200" and conv.get("plan") == "standard" and conv.get("trial_ends_at") is None and conv.get("status") == "active",
              "a_second_convert_and_an_unknown_action_are_refused": status("tr-again") == "409" and status("tr-bad") == "400",
              "the_directory_columns_exist_on_the_real_database": all("trial_ends_at" in b and "source" in b for b in listing) and len(listing) > 0,
              "answers": {"first": status("su-first"), "again": status("su-again"), "garbage": status("su-garbage"), "untick": status("su-untick"), "days_left": round(days, 3) if days else None, "business": {k: biz.get(k) for k in ("plan", "status", "source", "members")}, "session_b_matches": payload.get("b") == biz.get("id"), "me": {"signedIn": me.get("signedIn"), "role": me.get("role")}, "customers": status("su-customers"), "customer_items": len(cust_list) if isinstance(cust_list, list) else None, "onboarding_steps": len(steps) if isinstance(steps, list) else None, "step_statuses": [x.get("status") for x in steps] if isinstance(steps, list) else None},
          }
          json.dump(out, open(os.path.join(r, "signup.json"), "w"), indent=1)
          bad = [k for k, v in out.items() if v is False]
          print("signup checks that did not hold:", bad)
          sys.exit(1 if bad else 0)
          PY
      - name: Back up, damage and restore a business on Cloudflare
        if: env.MODE == 'rehearsal'
        id: backup
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY")
          COOKIE=$(cat "$RESULTS/cookie.txt")
          fingerprint() { curl -s "${A[@]}" -H "X-Target-Business: $1" "$BASE/admin/migration/fingerprint" > "$RESULTS/$2"; }
          customers() { curl -s -H "Cookie: $COOKIE" "$BASE/customers" > "$RESULTS/$1"; }
          # LINKED data first. Two PAID invoices with payment details make the real import write invoices AND payments that point at their customers (payments.customer_id -> customers: the schema's one foreign key). The first real
          # restore on production (2026-10-14) failed on exactly that shape, and this rehearsal used to restore a business with no payments at all.
          printf 'Invoice,Date,Client,Total,Paid,Balance due,Payment details\nLINK-1,2026-10-14,Staging Customer One,100.00,100.00,0.00,100.00;2026-10-14;EFT\nLINK-2,2026-10-14,Staging Link Two,250.00,250.00,0.00,150.00;2026-10-14;EFT|100.00;2026-10-14;Cash\n' > "$RESULTS/linked.csv"
          curl -s -o "$RESULTS/backup-linked-import.json" -X POST -H "Cookie: $COOKIE" -F "csv=@$RESULTS/linked.csv;type=text/csv" "$BASE/files/invoices-csv-import"
          customers backup-customers-before.json
          note() { curl -s -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" "$BASE/debug/customer-notes?customerId=1" > "$RESULTS/$1"; }
          note backup-note-before.json
          fingerprint staging-co backup-fp-original.json
          fingerprint staging-two backup-fp-other-before.json
          curl -s -X POST "${A[@]}" -H "X-Target-Business: staging-co" "$BASE/admin/backup/run" > "$RESULTS/backup-run.json"
          curl -s "${A[@]}" -H "X-Target-Business: staging-co" "$BASE/admin/backup/status" > "$RESULTS/backup-status.json"
          SNAPSHOT=$(python3 -c "import json; print(json.load(open('$RESULTS/backup-run.json')).get('snapshot',''))")
          echo "snapshot: $SNAPSHOT"
          # Damage the business the way a bad day would: add customers that were never there.
          printf 'name\nDAMAGE ONE\nDAMAGE TWO\nDAMAGE THREE\n' > "$RESULTS/damage.csv"
          curl -s -o "$RESULTS/backup-damage.json" -X POST -H "Cookie: $COOKIE" -F "csv=@$RESULTS/damage.csv;type=text/csv" "$BASE/files/customers-csv-import"
          curl -s -o /dev/null -X POST "$BASE/debug/kv-set" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" -H "Content-Type: application/json" -d '{"key":"customer:1","value":{"note":"VANDALISED NOTE"}}'
          customers backup-customers-damaged.json
          note backup-note-damaged.json
          fingerprint staging-co backup-fp-damaged.json
          curl -s -X POST "${A[@]}" -H "X-Target-Business: staging-co" -H "Content-Type: application/json" -d "{\"snapshot\":\"$SNAPSHOT\",\"confirm\":\"staging-co\"}" "$BASE/admin/backup/restore" > "$RESULTS/backup-restore.json"
          customers backup-customers-restored.json
          note backup-note-restored.json
          fingerprint staging-co backup-fp-restored.json
          fingerprint staging-two backup-fp-other-after.json
          curl -s "${A[@]}" -H "X-Target-Business: staging-co" "$BASE/admin/backup/list" > "$RESULTS/backup-list.json"
          python3 - <<'PY' > "$RESULTS/backup.json"
          import json, os
          r = os.environ["RESULTS"]
          def read(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return None
          def names(doc):
              rows = doc if isinstance(doc, list) else (doc or {}).get("items") or []
              return sorted(str(x.get("name")) for x in rows if isinstance(x, dict))
          def core(fp):
              return {"tables": (fp or {}).get("tables"), "notes": (fp or {}).get("notes"), "files": (fp or {}).get("files")}
          before, damaged, restored = (read("backup-customers-%s.json" % k) for k in ("before", "damaged", "restored"))
          fo, fd, fr = read("backup-fp-original.json"), read("backup-fp-damaged.json"), read("backup-fp-restored.json")
          def count(fp, table):
              try:
                  return fp["tables"][table]["count"]
              except Exception:
                  return None
          note_before, note_damaged, note_restored = (json.dumps(read("backup-note-%s.json" % k), sort_keys=True) for k in ("before", "damaged", "restored"))
          damage = read("backup-damage.json")
          rep = read("backup-restore.json") or {}
          run = read("backup-run.json") or {}
          lst = (read("backup-list.json") or {}).get("snapshots") or []
          print(json.dumps({
              "snapshot": run.get("snapshot"), "snapshot_took": {k: run.get(k) for k in ("tables", "rows", "notes", "files", "filesMirroredNow", "ms")},
              "status_after_the_snapshot": {k: (read("backup-status.json") or {}).get(k) for k in ("backupBucketConfigured", "lastAttemptOk", "complete", "newestAgeHours")},
              "customers_as_listed": {"before": len(names(before)), "damaged": len(names(damaged)), "restored": len(names(restored))},
              "customers_in_the_fingerprints": {"original": count(fo, "customers"), "damaged": count(fd, "customers"), "restored": count(fr, "customers")},
              "the_import_answered": (json.dumps(damage)[:160] if damage is not None else None),
              "damage_1_customers_were_added": count(fd, "customers") is not None and count(fd, "customers") == (count(fo, "customers") or 0) + 3,   # judged by the fingerprint's count: the customers LIST is capped, and staging holds 26,117 customers left by the load tests
              "damage_2_the_note_was_overwritten": note_damaged != note_before and "VANDALISED NOTE" in note_damaged,
              "the_damaged_fingerprint_differs_from_the_original": core(fd) != core(fo),
              "the_note_is_back": note_restored == note_before and "VANDALISED" not in note_restored,
              "restore_report": {k: rep.get(k) for k in ("ok", "tablesRestored", "rowsRestored", "notesRestored", "filesRestoredFromMirror", "filesMissingEverywhere", "differences", "error")},
              "customers_are_back_exactly_as_before": names(restored) == names(before),
              "the_whole_business_fingerprint_equals_the_original": core(fr) == core(fo),
              "no_damage_left": not any(n.startswith("DAMAGE") for n in names(restored)),
              "linked_import_answered": (json.dumps(read("backup-linked-import.json"))[:160] if read("backup-linked-import.json") is not None else None),
              "payments_before_and_after": {"original": count(fo, "payments"), "restored": count(fr, "payments")},
              "linked_rows_exist_before": (count(fo, "payments") or 0) >= 3 and (count(fo, "invoices") or 0) >= 2,
              "the_linked_rows_are_back": count(fr, "payments") == count(fo, "payments") and count(fr, "invoices") == count(fo, "invoices") and count(fr, "customers") == count(fo, "customers"),
              "restore_ok": rep.get("ok") is True and not rep.get("error"),
              "a_safety_snapshot_was_taken": any(str(s.get("name", "")).endswith("-pre-restore") for s in lst),
              "the_other_business_is_untouched": core(read("backup-fp-other-before.json")) == core(read("backup-fp-other-after.json")),
          }))
          PY
          # A false check FAILS the step: until 2026-10-14 the results were only recorded, so a restore that failed would have looked like a step that passed.
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RESULTS"], "backup.json")))
          required = ["damage_1_customers_were_added", "damage_2_the_note_was_overwritten", "the_damaged_fingerprint_differs_from_the_original", "the_note_is_back", "restore_ok", "customers_are_back_exactly_as_before", "the_whole_business_fingerprint_equals_the_original", "no_damage_left", "a_safety_snapshot_was_taken", "the_other_business_is_untouched", "linked_rows_exist_before", "the_linked_rows_are_back"]
          failed = [k for k in required if d.get(k) is not True]
          print("restore checks that did not hold:", failed)
          sys.exit(1 if failed else 0)
          PY

      - name: Probe the memory index on Cloudflare
        if: env.MODE == 'rehearsal'
        id: vectors
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          INDEX_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/vectorize/v2/indexes/${SLUG}-memory"
          python3 - <<'PY'
          import json, os
          r = os.environ["RESULTS"]
          e1 = [1.0] + [0.0] * 767
          for name, text in (("first", "FIRST probe"), ("second", "SECOND probe")):
              json.dump({"vectors": [{"id": "probe-1", "values": e1, "metadata": {"customerId": "1", "text": text}}]}, open(os.path.join(r, "vec-" + name + ".json"), "w"))
          json.dump({"vector": e1, "topK": 10}, open(os.path.join(r, "vec-query.json"), "w"))
          json.dump({"vector": e1, "topK": 10, "returnMetadata": "all", "namespace": "staging-co"}, open(os.path.join(r, "rest-q-first.json"), "w"))
          json.dump({"vector": e1, "topK": 10, "returnMetadata": "all", "namespace": "staging-two"}, open(os.path.join(r, "rest-q-second.json"), "w"))
          json.dump({"vector": e1, "topK": 10, "returnMetadata": "all"}, open(os.path.join(r, "rest-q-all.json"), "w"))
          json.dump({"ids": ["probe-1"]}, open(os.path.join(r, "vec-ids.json"), "w"))
          def prefix(business):
              h = 0x811c9dc5
              for b in business.encode():
                  h = ((h ^ b) * 0x01000193) & 0xFFFFFFFF
              return format(h, "08x") + "~"
          json.dump({"ids": [prefix("staging-co") + "probe-1", prefix("staging-two") + "probe-1"]}, open(os.path.join(r, "rest-ids.json"), "w"))
          PY
          post() { curl -s -o "$3" -w '%{http_code}' -X POST "$BASE$1" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $2" -H "Content-Type: application/json" --data-binary "@$4"; }
          rest() { curl -s -o "$2" -X "$3" "$INDEX_API$1" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" ${4:+--data-binary "@$4"}; }
          S1=$(post /admin/migration/vectors staging-co "$RESULTS/up-first.json" "$RESULTS/vec-first.json")
          S2=$(post /admin/migration/vectors staging-two "$RESULTS/up-second.json" "$RESULTS/vec-second.json")
          LAST=$(python3 -c "import json; print(json.load(open('$RESULTS/up-second.json')).get('mutationId') or '')")
          # Vectorize applies writes asynchronously. Wait for Cloudflare's own marker (processedUpToMutation) to reach the LAST write, up to three minutes, then look.
          rest /info "$RESULTS/info-first.json" GET
          waited=0
          for tick in $(seq 1 36); do
            rest /info "$RESULTS/info-last.json" GET
            if [ -n "$LAST" ] && grep -q "$LAST" "$RESULTS/info-last.json"; then break; fi
            sleep 5; waited=$((waited + 5))
          done
          for attempt in 1 2 3 4 5 6; do
            post /admin/migration/vectors-query staging-co "$RESULTS/q-first.json" "$RESULTS/vec-query.json" > /dev/null
            post /admin/migration/vectors-query staging-two "$RESULTS/q-second.json" "$RESULTS/vec-query.json" > /dev/null
            if grep -q "probe" "$RESULTS/q-first.json" && grep -q "probe" "$RESULTS/q-second.json"; then break; fi
            sleep 5
          done
          post /admin/migration/vectors-by-ids staging-co "$RESULTS/ids-first.json" "$RESULTS/vec-ids.json" > /dev/null
          post /admin/migration/vectors-by-ids staging-two "$RESULTS/ids-second.json" "$RESULTS/vec-ids.json" > /dev/null
          rest "/list?count=100" "$RESULTS/vec-list.json" GET
          rest /query "$RESULTS/rq-first.json" POST "$RESULTS/rest-q-first.json"
          rest /query "$RESULTS/rq-second.json" POST "$RESULTS/rest-q-second.json"
          rest /query "$RESULTS/rq-all.json" POST "$RESULTS/rest-q-all.json"
          rest /get_by_ids "$RESULTS/rest-ids-out.json" POST "$RESULTS/rest-ids.json"
          UPSERT_FIRST="$S1" UPSERT_SECOND="$S2" WAITED="$waited" python3 - <<'PY' > "$RESULTS/vectors.json"
          import os, json
          r = os.environ["RESULTS"]
          def load(name):
              try:
                  return json.load(open(os.path.join(r, name)))
              except Exception:
                  return None
          def raw(name):
              try:
                  return open(os.path.join(r, name)).read()[:380]
              except Exception:
                  return None
          def texts(doc):
              return sorted((m.get("metadata") or {}).get("text") for m in (doc or {}).get("matches", []))
          def rest_texts(doc):
              return sorted(((m.get("metadata") or {}).get("text")) for m in ((doc or {}).get("result") or {}).get("matches", []))
          def prefix(business):
              h = 0x811c9dc5
              for b in business.encode():
                  h = ((h ^ b) * 0x01000193) & 0xFFFFFFFF
              return format(h, "08x") + "~"
          def by_id(doc):
              return [(v.get("metadata") or {}).get("text") for v in (doc or {}).get("vectors", [])]
          listed = load("vec-list.json") or {}
          ids = sorted(v["id"] for v in (listed.get("result") or {}).get("vectors", []) if "probe-1" in v["id"])
          qa, qb = texts(load("q-first.json")), texts(load("q-second.json"))
          info_a, info_b = (load("info-first.json") or {}).get("result"), (load("info-last.json") or {}).get("result")
          print(json.dumps({
              "upsert_status": {"first_business": os.environ["UPSERT_FIRST"], "second_business": os.environ["UPSERT_SECOND"]},
              "seconds_waited_for_cloudflare_to_process_the_writes": int(os.environ["WAITED"]),
              "index_info_before_waiting": info_a,
              "index_info_after_waiting": info_b,
              "search_in_first_business_returns": qa,
              "search_in_second_business_returns": qb,
              "each_business_searches_only_its_own_memory": qa == ["FIRST probe"] and qb == ["SECOND probe"],
              "same_id_in_both_businesses_reads_back_its_own": by_id(load("ids-first.json")) == ["FIRST probe"] and by_id(load("ids-second.json")) == ["SECOND probe"],
              "physical_ids_in_the_shared_index": ids,
              "ids_are_prefixed_with_the_business": ids == sorted([prefix("staging-co") + "probe-1", prefix("staging-two") + "probe-1"]),
              "list_api_total_vectors": (listed.get("result") or {}).get("totalCount"),
              "DIRECT_api_query_in_namespace_staging_co": rest_texts(load("rq-first.json")),
              "DIRECT_api_query_in_namespace_staging_two": rest_texts(load("rq-second.json")),
              "DIRECT_api_query_with_no_namespace": rest_texts(load("rq-all.json")),
              "DIRECT_api_get_by_prefixed_ids": [(v.get("metadata") or {}).get("text") for v in ((load("rest-ids-out.json") or {}).get("result") or [])] if isinstance((load("rest-ids-out.json") or {}).get("result"), list) else (load("rest-ids-out.json") or {}).get("result"),
              "raw_first_search_answer": raw("q-first.json"),
              "raw_first_by_id_answer": raw("ids-first.json"),
              "raw_first_upsert_answer": raw("up-first.json"),
              "raw_second_upsert_answer": raw("up-second.json"),
              "raw_direct_query_staging_two": raw("rq-second.json"),
          }))
          PY

      - name: Measure the model, prompt size and prompt caching
        if: env.MODE == 'rehearsal'
        id: model
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          probe() { curl -s -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/trial-ai?where=object&n=$2&chars=$3&salt=$1-${GITHUB_RUN_ID}${4:+&affinity=$4}" > "$RESULTS/model-$1.json"; }
          # Every case has its own salt, so each starts from a prefix no earlier call has warmed. Same instance every time: the London object.
          probe small 3 500
          probe medium 3 8000
          probe large 3 40000
          probe large-with-affinity 5 40000 "probe-${GITHUB_RUN_ID}"
          probe large-no-affinity 5 40000
          python3 - <<'PY' > "$RESULTS/model.json"
          import json, os
          r = os.environ["RESULTS"]
          out = {}
          for case in ("small", "medium", "large", "large-with-affinity", "large-no-affinity"):
              try:
                  d = json.load(open(os.path.join(r, "model-" + case + ".json")))
              except Exception:
                  out[case] = None
                  continue
              calls = d.get("callsMs") or []
              out[case] = {"padding_chars": d.get("promptPaddingChars"), "affinity_sent": bool(d.get("affinity")), "calls_ms": calls, "first_ms": calls[0] if calls else None,
                           "later_calls_median_ms": sorted(calls[1:])[len(calls[1:]) // 2] if len(calls) > 1 else None, "first_usage": (d.get("usage") or [None])[0], "last_usage": (d.get("usage") or [None])[-1]}
          print(json.dumps(out))
          PY

      - name: Send a real sentence through the business object
        if: env.MODE == 'rehearsal'
