              applied = ((h.get("lastMigration") or {}).get("applied")) or []
              out["businesses"][b] = {
                  "migrated_by_this_deploy": probe in applied, "last_migration_applied": applied,
                  "nothing_pending": h.get("pending") == [], "no_error": h.get("error") is None,
                  "steps_applied": h.get("appliedSteps"), "steps_this_code_knows": h.get("latestKnownStep"), "steps_from_earlier_runs_this_code_does_not_know": h.get("unknownApplied"),
                  "column_is_there": column in [c.get("name") for c in (after.get("columns") or [])],
                  "column_was_not_there_before": column not in [c.get("name") for c in (before.get("columns") or [])],
                  "customers_before": before.get("count"), "customers_after": after.get("count"),
                  "data_kept": before.get("count") is not None and after.get("count") is not None and after.get("count") >= before.get("count"),
              }
          out["all_migrated_and_data_kept"] = all(v["migrated_by_this_deploy"] and v["nothing_pending"] and v["no_error"] and v["column_is_there"] and v["data_kept"] for v in out["businesses"].values())
          print(json.dumps(out))
          PY

      - name: Onboarding and imports on Cloudflare (a real owner session, a real Durable Object)
