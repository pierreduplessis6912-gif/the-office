          routes = {x["route"]: {k: x[k] for k in ("n", "p50Ms", "p95Ms", "meanAiMs", "meanAiCalls", "meanDbMs", "meanDbCalls")} for x in (tim.get("byPath") or [])}
          print(json.dumps({
              "sentence": "Invoice Staging Customer One R1500 for repairing the bathroom floor",
              "message_status_and_seconds_from_a_US_runner": code("message.code"),
              "reply": (msg.get("message") or "")[:300] if isinstance(msg, dict) else None,
              "held_action": {"id": msg.get("pendingActionId"), "type": msg.get("pendingActionType")} if isinstance(msg, dict) else None,
              "customer_matched": (customer or {}).get("name") if isinstance(customer, dict) else None,
              "confirm_status_and_seconds": code("confirm.code"),
              "confirm_reply": (conf.get("message") or conf.get("status") or "")[:300] if isinstance(conf, dict) else None,
              "inside_the_object_model_versus_database": routes,
          }))
