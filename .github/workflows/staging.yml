          N="Proof Customer $RUN"; N2="Proof Customer $RUN (Pty) Ltd"; ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$N"); ENC2=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$N2")
          rec find-before "$RESULTS/pp-find-before.json" "${M[@]}" "$BASE/engine/parties?name=$ENC"
          rec propose-create "$RESULTS/pp-propose-create.json" "${M[@]}" -X POST -d "{\"capability\":\"party.create\",\"payload\":{\"kind\":\"organisation\",\"name\":\"$N\",\"roles\":[\"customer\"],\"contact\":{\"email\":\"accounts@proof.example\",\"phone\":\"+27 82 555 0101\"}},\"transcript\":\"(parties-proof) add $N as a customer\"}" "$BASE/engine/proposals"
          A1=$(jget "$RESULTS/pp-propose-create.json" "d.get('actionId') if d.get('status')=='held' else ''")
          rec find-while-held "$RESULTS/pp-find-held.json" "${M[@]}" "$BASE/engine/parties?name=$ENC"
          [ -n "$A1" ] && rec confirm-create "$RESULTS/pp-confirm-create.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$A1/confirm"
          rec find-after-create "$RESULTS/pp-find-created.json" "${M[@]}" "$BASE/engine/parties?name=$ENC"
          PID=$(jget "$RESULTS/pp-find-created.json" "((d.get('result') or {}).get('parties') or [{}])[0].get('id') or ''")
          rec propose-duplicate "$RESULTS/pp-duplicate.json" "${M[@]}" -X POST -d "{\"capability\":\"party.create\",\"payload\":{\"kind\":\"person\",\"name\":\"  ${N^^} \",\"roles\":[\"supplier\"]},\"transcript\":\"(parties-proof) a duplicate\"}" "$BASE/engine/proposals"
          if [ -n "$PID" ]; then
            rec propose-rename "$RESULTS/pp-propose-rename.json" "${M[@]}" -X POST -d "{\"capability\":\"party.edit\",\"payload\":{\"partyId\":$PID,\"name\":\"$N2\"},\"transcript\":\"(parties-proof) rename\"}" "$BASE/engine/proposals"
            A2=$(jget "$RESULTS/pp-propose-rename.json" "d.get('actionId') if d.get('status')=='held' else ''")
            [ -n "$A2" ] && rec confirm-rename "$RESULTS/pp-confirm-rename.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$A2/confirm"
            rec find-renamed "$RESULTS/pp-find-renamed.json" "${M[@]}" "$BASE/engine/parties?name=$ENC2"
            rec record-party "$RESULTS/pp-record.json" "${M[@]}" "$BASE/engine/records/party/$PID"
            rec propose-edit-1 "$RESULTS/pp-edit1.json" "${M[@]}" -X POST -d "{\"capability\":\"party.edit\",\"payload\":{\"partyId\":$PID,\"addRoles\":[\"supplier\"]},\"transcript\":\"(parties-proof) edit one\"}" "$BASE/engine/proposals"
            rec propose-edit-2 "$RESULTS/pp-edit2.json" "${M[@]}" -X POST -d "{\"capability\":\"party.edit\",\"payload\":{\"partyId\":$PID,\"contact\":{\"phone\":null}},\"transcript\":\"(parties-proof) edit two\"}" "$BASE/engine/proposals"
            E1=$(jget "$RESULTS/pp-edit1.json" "d.get('actionId') if d.get('status')=='held' else ''"); E2=$(jget "$RESULTS/pp-edit2.json" "d.get('actionId') if d.get('status')=='held' else ''")
            [ -n "$E2" ] && rec confirm-edit-2 "$RESULTS/pp-confirm-edit2.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$E2/confirm"
            [ -n "$E1" ] && rec confirm-edit-1-stale "$RESULTS/pp-confirm-edit1.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$E1/confirm"
