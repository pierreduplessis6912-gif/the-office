          c["accepting_the_current_quotation_works"] = log.get("confirm-accept") == "200" and fin.get("status") == "accepted"
          c["an_accepted_quotation_cannot_be_accepted_again_or_revised"] = log.get("propose-accept-again") == "409" and log.get("propose-revise-accepted") == "409"
          c["the_record_is_explained"] = {"quotation.accepted", "quotation.revised"} <= {h.get("type") for h in (res("qp-record-final.json").get("history") or [])}
          c["a_quotation_is_not_a_debt"] = log.get("owes-before") == "200" and log.get("owes-after") == "200" and res("qp-owes-before.json").get("totalMinor") == res("qp-owes-after.json").get("totalMinor")
          c["an_installer_is_refused_a_read_a_proposal_and_the_record"] = log.get("installer-find") == "403" and log.get("installer-propose") == "403" and log.get("installer-record") in ("403", "404")
          c["a_salesperson_may_find_and_propose"] = log.get("sales-find") == "200" and log.get("sales-propose") == "200"
          c["the_integrity_verifier_is_clean_at_the_end"] = (st1.get("integrity") or {}).get("ok") is True
          out = {"when": __import__("datetime").datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7], "mode": "quotations-proof", "business": "staging-quotes",
                 "started_in": {"mode": st0.get("mode"), "rows": st0.get("rows")}, "http": log, "checks": c, "passed": all(c.values()), "failed": [k for k, v in c.items() if not v]}
          print(json.dumps(out, indent=1))
          PY
          cat "$RESULTS/quotations-proof.json"
          mkdir -p ops
          cp "$RESULTS/quotations-proof.json" ops/staging-quotations-proof-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts 2>/dev/null
          git add ops/staging-quotations-proof-last.json
          git commit -m "Staging quotations proof record (statuses, checks and pass or fail only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$RESULTS/quotations-proof.json'))['passed'] else 1)"

      - name: Stack proof (mode stack-proof, the dedicated staging business staging-stack only)
        if: env.MODE == 'stack-proof'
        run: |
          # Proves, on a REAL Durable Object through the real routes, the capabilities built after the first three proofs: the business profile, credit notes, apply / refund / undo / void of leftover credit, debit notes, the tax lock, expenses and the
          # VAT summary (docs/decisions/credit-notes.md, credit-note-follow-ups.md, expenses.md). Its OWN business (staging-stack), so it never disturbs staging-two or staging-co; it provisions only an engine-EMPTY object; every figure it asserts is
          # read back from the object (the sample's amounts are not assumed); it approves only the actions it proposes itself. Staging only; never production.
          set +e
          export BASE="https://${SLUG}.websitehub.co.za"
          export BIZ=staging-stack
          export RUN="${{ github.run_id }}"
          mkdir -p "$RESULTS"
          cat > "$RESULTS/mkcookie.py" <<'PY'
          import os, json, hmac, hashlib, base64, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          body = {"email": os.environ["EMAIL"], "exp": int(time.time() * 1000) + 3600000, "b": os.environ["BIZ"]}
          p = b(json.dumps(body, separators=(",", ":")).encode())
          s = b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest())
          print("office_session=" + p + "." + s)
          PY
          export OWNER_C=$(EMAIL="staging-stack-owner@example.com" python3 "$RESULTS/mkcookie.py")
          export ACCT_C=$(EMAIL="staging-stack-accountant@example.com" python3 "$RESULTS/mkcookie.py")
          export INST_C=$(EMAIL="staging-stack-installer@example.com" python3 "$RESULTS/mkcookie.py")
          echo "::add-mask::$OWNER_C"; echo "::add-mask::$ACCT_C"; echo "::add-mask::$INST_C"
          python3 - <<'PY' > "$RESULTS/stack-proof.json"
          import os, json, urllib.request, urllib.error, datetime
          BASE, BIZ, RUN = os.environ["BASE"], os.environ["BIZ"], os.environ["RUN"]
          COOKIE = {"owner": os.environ["OWNER_C"], "accountant": os.environ["ACCT_C"], "installer": os.environ["INST_C"]}
          ADMIN = {"X-Admin-Key": os.environ["STAGING_ADMIN_KEY"], "X-Admin-Confirm": os.environ["STAGING_CONFIRM_KEY"], "X-Target-Business": BIZ}
          log = {}
          def call(name, method, path, body=None, role=None, admin=False):
              h = {"Content-Type": "application/json"}
              if role: h["Cookie"] = COOKIE[role]
              if admin: h.update(ADMIN)
              req = urllib.request.Request(BASE + path, data=(json.dumps(body).encode() if body is not None else None), headers=h, method=method)
              try:
                  r = urllib.request.urlopen(req, timeout=120); code, txt = r.status, r.read()
              except urllib.error.HTTPError as e: code, txt = e.code, e.read()
              except Exception: code, txt = 0, b""
              try: data = json.loads(txt)
              except Exception: data = {}
              log[name] = code
              return code, data
          def propose(name, role, cap, payload):
              c, d = call(name, "POST", "/engine/proposals", {"capability": cap, "payload": payload, "transcript": "(stack-proof) " + cap}, role)
              return c, d, (d.get("actionId") if d.get("status") == "held" else None)
          def approve(name, role, aid):
              if aid is None: log[name] = -1; return -1, {}
              return call(name, "POST", f"/actions/{aid}/confirm", {}, role)
          def do(name, role, cap, payload):
              c, d, aid = propose(name + "-propose", role, cap, payload)
              c2, d2 = approve(name + "-approve", role, aid)
              return c, d, c2, d2
          def rec(name, role, kind, i): return call(name, "GET", f"/engine/records/{kind}/{i}", None, role)[1].get("result") or {}
          fld = lambda r, k: next((f.get("value") for f in (r.get("fields") or []) if f.get("key") == k), None)
          rel = lambda r, role: [x["ref"]["id"] for x in (r.get("relations") or []) if x.get("role") == role]
          owes = lambda n: (call(n, "GET", "/engine/receivables?party=Mokoena", None, "accountant")[1].get("result") or {})
          checks = {}
          st0 = call("status-start", "GET", "/admin/engine/status", None, None, True)[1]
          for r_, e_ in [("owner", "owner"), ("accountant", "accountant"), ("installer", "installer")]:
              call("membership-" + r_, "POST", "/debug/create-membership", {"google_email": f"staging-stack-{e_}@example.com", "role": r_}, None, True)
          if st0.get("mode") != "engine": call("provision", "POST", "/admin/engine/provision-sample", {"confirm": BIZ}, None, True)
          st1 = call("status-ready", "GET", "/admin/engine/status", None, None, True)[1]
          NEED = ["party.create", "business.profile.set", "tax_lock.set", "credit_note.issue", "credit.apply", "refund.record", "credit_note.void", "debit_note.issue", "allocation.remove", "refund.void", "payment.allocate", "payment.refund", "expense.record", "expense.void", "expenses.find", "vat.summary", "credits.find", "business.get"]
          checks["the_object_is_in_engine_mode_with_every_capability"] = st1.get("mode") == "engine" and all(x in (st1.get("available") or []) for x in NEED)
          # 1. the business profile
          profile = {"legalName": f"Stack Proof {RUN} (Pty) Ltd", "address": "5 Industrial Road, Empangeni, 3880", "vatRegistered": True, "vatNumber": "4123456789"}
          c, d, c2, d2 = do("profile", "owner", "business.profile.set", profile)
          bg = call("business-get", "GET", "/engine/business", None, "owner")[1].get("result") or {}
          checks["the_owner_sets_the_business_profile_and_reads_it_back"] = c2 == 200 and (bg.get("profile") or {}).get("vatNumber") == "4123456789"
          call("installer-business", "GET", "/engine/business", None, "installer")
          # 2. credit note 1: half of invoice 1's first line
          inv1 = rec("inv1-before", "accountant", "document", 1); line = ((inv1.get("collections") or {}).get("lines") or [{}])[0]
          o1 = fld(inv1, "outstandingMinor"); q = max(1, int(line.get("quantityMilli", 2)) // 2); price = int(line.get("unitPriceMinor", 1))
          cn1p = {"invoiceId": 1, "reason": f"Stack proof credit {RUN}", "issuedOn": "2026-11-10", "lines": [{"invoiceLineNo": int(line.get("lineNo", 1)), "quantityMilli": q, "unitPriceMinor": price}]}
          c, d, aid = propose("credit1-propose", "accountant", "credit_note.issue", cn1p)
          held_ok = c == 200 and aid is not None and (fld(rec("inv1-held", "accountant", "document", 1), "outstandingMinor") == o1)
          c2, d2 = approve("credit1-approve", "accountant", aid)
          inv1b = rec("inv1-after-credit", "accountant", "document", 1)
          cn1 = (rel(inv1b, "credit_note") or [0])[0]; cn1v = rec("cn1", "accountant", "document", cn1)
          g1 = fld(cn1v, "grossMinor")
          checks["a_credit_note_is_held_then_approved_and_reduces_what_is_owed"] = held_ok and c2 == 200 and isinstance(g1, int) and fld(inv1b, "creditedMinor") == g1 and (o1 is None or fld(inv1b, "outstandingMinor") == max(0, o1 - g1) or fld(inv1b, "outstandingMinor") < o1)
          hist = [h for h in (cn1v.get("history") or []) if h.get("type") == "credit_note.issued"]
          checks["the_credit_note_is_explained"] = bool(hist) and bool(hist[0].get("approvedBy")) and hist[0].get("contract") == "credit_note.issue" and fld(cn1v, "status") == "issued"
          checks["tax_is_inherited_never_chosen"] = fld(cn1v, "taxMinor") is not None and fld(cn1v, "grossMinor") == fld(cn1v, "netMinor") + fld(cn1v, "taxMinor")
          checks["the_tax_particulars_check_is_shown_on_the_invoice"] = isinstance(fld(inv1b, "particularsComplete"), bool)
          cbad = dict(cn1p); cbad["lines"] = [{"invoiceLineNo": int(line.get("lineNo", 1)), "quantityMilli": int(line.get("quantityMilli", 1)) * 100, "unitPriceMinor": price}]
          c, d, _ = propose("credit-over-propose", "accountant", "credit_note.issue", cbad)
          checks["crediting_more_than_was_invoiced_is_refused"] = c == 409 and d.get("error") == "invalid_state"
          # 3. pay what is left on invoice 1, then credit again: the whole credit is unapplied
          o1b = fld(inv1b, "outstandingMinor") or 0
          if o1b > 0: do("pay-rest", "accountant", "payment.record", {"partyId": 1, "amountMinor": o1b, "currency": "ZAR", "occurredOn": "2026-11-05", "allocate": "oldest_first"})
          cn2p = dict(cn1p); cn2p["reason"] = f"Stack proof second credit {RUN}"; cn2p["lines"] = [{"invoiceLineNo": int(line.get("lineNo", 1)), "quantityMilli": max(1, q // 2), "unitPriceMinor": price}]
          c, d, c2, d2 = do("credit2", "accountant", "credit_note.issue", cn2p)
          inv1c = rec("inv1-after-credit2", "accountant", "document", 1); cn2 = [x for x in rel(inv1c, "credit_note") if x != cn1]; cn2 = cn2[0] if cn2 else 0
          cn2v = rec("cn2", "accountant", "document", cn2); g2 = fld(cn2v, "grossMinor")
          checks["a_credit_on_a_paid_invoice_is_left_as_credit_owed_back"] = c2 == 200 and fld(cn2v, "unappliedMinor") == g2 and fld(cn2v, "availableMinor") == g2 and (owes("owes-after-credit2").get("unappliedCreditMinor") or 0) >= g2
          cf = call("credits-find", "GET", "/engine/credits?partyId=1", None, "accountant")[1].get("result") or {}
          checks["finding_credit_lists_it"] = any(x.get("id") == cn2 and x.get("availableMinor") == g2 for x in (cf.get("credits") or []))
          # 4. apply it to invoice 2, undo it, refund part of it, void the refund
          inv2 = rec("inv2-before", "accountant", "document", 2); o2 = fld(inv2, "outstandingMinor") or 0; amt = min(g2, o2)
          if amt > 0:
              c, d, c2, d2 = do("apply", "accountant", "credit.apply", {"creditNoteId": cn2, "invoiceId": 2, "amountMinor": amt, "appliedOn": "2026-11-11"})
              inv2b = rec("inv2-after-apply", "accountant", "document", 2)
              checks["a_leftover_credit_is_applied_to_another_invoice"] = c2 == 200 and fld(inv2b, "outstandingMinor") == o2 - amt and fld(rec("cn2-after-apply", "accountant", "document", cn2), "availableMinor") == g2 - amt
              al = ((inv2b.get("collections") or {}).get("allocations") or [])
              alid = next((a.get("id") for a in al if a.get("amountMinor") == amt), None)
              if alid is not None:
                  c, d, c2, d2 = do("unapply", "accountant", "allocation.remove", {"allocationId": alid, "reason": "stack proof undo"})
                  checks["removing_the_application_restores_the_credit_and_what_the_invoice_owes"] = c2 == 200 and fld(rec("inv2-after-unapply", "accountant", "document", 2), "outstandingMinor") == o2 and fld(rec("cn2-after-unapply", "accountant", "document", cn2), "availableMinor") == g2
              else: checks["removing_the_application_restores_the_credit_and_what_the_invoice_owes"] = False
          else:
              checks["a_leftover_credit_is_applied_to_another_invoice"] = False; checks["removing_the_application_restores_the_credit_and_what_the_invoice_owes"] = False
          rf = min(1000, g2)
          c, d, c2, d2 = do("refund", "accountant", "refund.record", {"creditNoteId": cn2, "amountMinor": rf, "refundedOn": "2026-11-12", "method": "eft"})
          avail_after_refund = fld(rec("cn2-after-refund", "accountant", "document", cn2), "availableMinor")
          rmv = (d2.get("outcome") or {}).get("movementId")
          checks["a_refund_reduces_the_credit_owed_back"] = c2 == 200 and avail_after_refund == g2 - rf
          if rmv is not None:
              c, d, c2, d2 = do("refund-void", "accountant", "refund.void", {"movementId": rmv, "reason": "stack proof bank returned it"})
              checks["voiding_the_refund_restores_the_credit"] = c2 == 200 and fld(rec("cn2-after-refund-void", "accountant", "document", cn2), "availableMinor") == g2
          else: checks["voiding_the_refund_restores_the_credit"] = False
          # 5. void credit note 2: possible now, and the invoice's credited figure goes back to credit note 1 only
          c, d, c2, d2 = do("void-cn2", "accountant", "credit_note.void", {"creditNoteId": cn2, "reason": "stack proof void", "voidedOn": "2026-11-13"})
          checks["a_credit_note_can_be_voided_once_nothing_was_spent"] = c2 == 200 and fld(rec("cn2-voided", "accountant", "document", cn2), "status") == "voided" and fld(rec("inv1-after-void", "accountant", "document", 1), "creditedMinor") == g1
          # 6. a debit note increases what is owed
          before = owes("owes-before-debit").get("totalMinor") or 0
          dn = {"invoiceId": 1, "reason": f"Stack proof extra {RUN}", "issuedOn": "2026-11-10", "lines": [{"invoiceLineNo": int(line.get("lineNo", 1)), "quantityMilli": 100, "unitPriceMinor": price}]}
          c, d, c2, d2 = do("debit", "accountant", "debit_note.issue", dn)
          after = owes("owes-after-debit").get("totalMinor") or 0
          checks["a_debit_note_is_owed_by_the_customer"] = c2 == 200 and after > before
          # 7. the tax lock: forward only, enforced
          c, d, c2, d2 = do("lock", "owner", "tax_lock.set", {"lockDate": "2026-11-09"})
          c, d, _ = propose("lock-back-propose", "owner", "tax_lock.set", {"lockDate": "2026-11-01"})
          c3, d3, _ = propose("locked-credit-propose", "accountant", "credit_note.issue", dict(cn1p, issuedOn="2026-11-09", reason="locked period"))
          checks["the_tax_lock_moves_forward_only_and_blocks_documents_in_the_locked_period"] = c2 == 200 and c == 409 and d.get("error") == "invalid_state" and c3 == 409 and d3.get("error") == "period_locked"
          # 8. expenses: a supplier, a paid expense, input tax, the VAT summary, a void
          c, d, c2, d2 = do("supplier", "accountant", "party.create", {"kind": "organisation", "name": f"Stack Timber {RUN}", "roles": ["supplier"], "contact": {"vatNumber": "4111111111", "address": "1 Mill Road, Empangeni"}})
          sid = (d2.get("outcome") or {}).get("partyId")
          ex = {"supplierId": sid, "incurredOn": "2026-11-12", "method": "eft", "category": "materials", "currency": "ZAR", "amountsIncludeTax": True, "lines": [{"description": "Plywood", "amountMinor": 23000, "taxBp": 1500}], "amountPaidMinor": 23000, "taxInvoiceHeld": True, "supplierInvoiceNumber": f"SP-{RUN}", "receiptRef": "stack-proof"}
          c, d, aid = propose("expense-propose", "accountant", "expense.record", ex)
          held = c == 200 and aid is not None
          c2, d2 = approve("expense-approve", "accountant", aid)
          eid = (d2.get("outcome") or {}).get("documentId")
          xf = call("expenses-find", "GET", "/engine/expenses?supplierId=%s" % sid, None, "accountant")[1].get("result") or {}
          xr = rec("expense-record", "accountant", "document", eid or 0)
          checks["a_paid_expense_is_recorded_and_explained"] = held and c2 == 200 and len(xf.get("expenses") or []) == 1 and fld(xr, "category") == "materials" and any(h.get("type") == "expense.recorded" and h.get("approvedBy") for h in (xr.get("history") or []))
          checks["its_input_tax_is_derived_as_claimable_with_no_reasons"] = fld(xr, "inputTaxClaimable") is True and fld(xr, "inputTaxMinor") == 3000 and fld(xr, "claimDate") == "2026-11-12"
          vs = call("vat-summary", "GET", "/engine/vat?from=2026-11-10&to=2026-11-30", None, "accountant")[1].get("result") or {}
          checks["the_vat_summary_has_its_input_side"] = vs.get("field15Minor") == 3000 and vs.get("inputTaxMinor") == 3000 and vs.get("outputOnly") is False and isinstance(vs.get("field4Minor"), int)
          c, d, _ = propose("expense-dup-propose", "accountant", "expense.record", dict(ex, incurredOn="2026-11-13"))
          checks["the_same_supplier_invoice_twice_is_refused"] = c == 409 and d.get("error") == "duplicate"
          c, d, c2, d2 = do("expense-void", "accountant", "expense.void", {"expenseId": eid, "reason": "stack proof void", "voidedOn": "2026-11-14"})
          vs2 = call("vat-summary-after-void", "GET", "/engine/vat?from=2026-11-10&to=2026-11-30", None, "accountant")[1].get("result") or {}
          checks["voiding_the_expense_removes_its_input_tax"] = c2 == 200 and vs2.get("inputTaxMinor") == 0 and len((call("expenses-find-after", "GET", "/engine/expenses?supplierId=%s" % sid, None, "accountant")[1].get("result") or {}).get("expenses") or []) == 0
          # 9. refusals for people who may not, and the integrity of the books
          ci, _ = call("installer-credit", "POST", "/engine/proposals", {"capability": "credit_note.issue", "payload": cn1p, "transcript": "x"}, "installer")
          ce, _ = call("installer-expenses", "GET", "/engine/expenses", None, "installer")
          cv, _ = call("installer-vat", "GET", "/engine/vat?from=2026-11-01&to=2026-11-30", None, "installer")
          cb = log.get("installer-business")
          checks["an_installer_is_refused_credit_notes_expenses_the_vat_summary_and_the_business_settings"] = ci == 403 and ce == 403 and cv == 403 and cb == 403
          st2 = call("status-end", "GET", "/admin/engine/status", None, None, True)[1]
          checks["the_integrity_verifier_is_clean_at_the_end"] = (st2.get("integrity") or {}).get("ok") is True
          out = {"when": datetime.datetime.utcnow().isoformat() + "Z", "run": RUN, "commit": os.environ.get("GITHUB_SHA", "")[:7], "mode": "stack-proof", "business": BIZ, "started_in": {"mode": st0.get("mode"), "rows": st0.get("rows")}, "http": log, "checks": checks, "passed": all(checks.values()), "failed": [k for k, v in checks.items() if not v]}
          print(json.dumps(out, indent=1))
          PY
          cat "$RESULTS/stack-proof.json"
          mkdir -p ops
          cp "$RESULTS/stack-proof.json" ops/staging-stack-proof-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts 2>/dev/null
          git add ops/staging-stack-proof-last.json
          git commit -m "Staging stack proof record (statuses, checks and pass or fail only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$RESULTS/stack-proof.json'))['passed'] else 1)"

      - name: Model-backed run (mode model-run, staging-two only, HELD until Pierre says run it)
        if: env.MODE == 'model-run'
        run: |
          # criterion 13 of docs/decisions/first-slice.md, agreed in docs/decisions/model-backed-run-scoping.md: a REAL model interprets a fixed list of sentences (tools/model-run-sentences.json) through POST /engine/interpret on staging-two,
          # signed in as that business's owner (a session minted here, the same way the rehearsal does it). Every sentence is bracketed by the engine's status and its waiting actions, so tools/model-run-judge.py can say whether the engine kept its promises.
          # NOTHING IS APPROVED: every payment the run causes to be held is declined by the run afterwards. Never production, never any business but staging-two.
          set +e
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: staging-two")
          mkdir -p "$RESULTS"
          : > "$RESULTS/mr-log.tsv"
          cat > "$RESULTS/mkcookie.py" <<'PY'
          import os, json, hmac, hashlib, base64, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          body = {"email": os.environ["EMAIL"], "exp": int(time.time() * 1000) + 3600000, "b": os.environ["BIZ"]}
          p = b(json.dumps(body, separators=(",", ":")).encode())
          s = b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest())
          print("office_session=" + p + "." + s)
          PY
          COOKIE=$(EMAIL="staging-two-owner@example.com" BIZ="staging-two" python3 "$RESULTS/mkcookie.py")
          echo "::add-mask::$COOKIE"
          M=(-H "Cookie: $COOKIE" -H "Content-Type: application/json")
          rec() { name=$1; out=$2; shift 2; R=$(curl -s --max-time 120 -o "$out" -w '%{http_code}\t%{time_total}' "$@"); printf '%s\t%s\n' "$name" "$R" | tee -a "$RESULTS/mr-log.tsv"; }
          rec status-start "$RESULTS/mr-status-start.json" "${A[@]}" "$BASE/admin/engine/status"
          rec provision "$RESULTS/mr-provision.json" "${A[@]}" -X POST -H "Content-Type: application/json" -d '{"confirm":"staging-two"}' "$BASE/admin/engine/provision-sample"
          rec baseline "$RESULTS/mr-baseline.json" "${M[@]}" "$BASE/engine/receivables?party=Mokoena"
          # Setup diagnostics, recorded whatever happens: who the session is, whether the customer reads by number, and whether its record opens. If the BASELINE does not come back 200 the sentences are NOT sent (no model call is spent
          # on a world that cannot be judged) and the record says so with these as evidence.
          rec diag-me "$RESULTS/mr-diag-me.json" "${M[@]}" "$BASE/auth/me"
          rec diag-party-by-id "$RESULTS/mr-diag-party-by-id.json" "${M[@]}" "$BASE/engine/receivables?party=1"
          rec diag-record-party "$RESULTS/mr-diag-record-party.json" "${M[@]}" "$BASE/engine/records/party/1"
          PARTY=$(python3 -c "import json; print(((json.load(open('$RESULTS/mr-baseline.json')).get('result') or {}).get('party') or {}).get('id') or '')")
          TODAY=$(date -u +%F)
          if [ -n "$PARTY" ]; then
            rec preheld "$RESULTS/mr-preheld.json" "${M[@]}" -X POST -d "{\"capability\":\"payment.record\",\"payload\":{\"partyId\":$PARTY,\"amountMinor\":50000,\"currency\":\"ZAR\",\"occurredOn\":\"$TODAY\",\"allocate\":\"oldest_first\"},\"transcript\":\"(model-run) a payment already waiting\"}" "$BASE/engine/proposals"
          fi
          python3 -c "
          import json
          for s in json.load(open('tools/model-run-sentences.json')): print(s['id'] + '\t' + s['text'])
          " > "$RESULTS/mr-sentences.tsv"
          BASEHTTP=$(awk -F'\t' '$1=="baseline"{print $2}' "$RESULTS/mr-log.tsv")
          if [ "$BASEHTTP" != "200" ] || [ -z "$PARTY" ]; then echo "the baseline read did not come back 200 (got ${BASEHTTP:-nothing}): the sentences are NOT sent"; : > "$RESULTS/mr-sentences.tsv"; fi
          while IFS=$'\t' read -r ID TEXT; do
            rec "before-$ID" "$RESULTS/mr-$ID-before.json" "${A[@]}" "$BASE/admin/engine/status"
            rec "pending-before-$ID" "$RESULTS/mr-$ID-pending-before.json" "${M[@]}" "$BASE/actions/pending"
            BODY=$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$TEXT")
            rec "interp-$ID" "$RESULTS/mr-$ID-resp.json" "${M[@]}" -X POST -d "$BODY" "$BASE/engine/interpret"
            rec "after-$ID" "$RESULTS/mr-$ID-after.json" "${A[@]}" "$BASE/admin/engine/status"
            rec "pending-after-$ID" "$RESULTS/mr-$ID-pending-after.json" "${M[@]}" "$BASE/actions/pending"
            HELD=$(python3 -c "import json; d=json.load(open('$RESULTS/mr-$ID-resp.json')); print(d.get('actionId') if d.get('status')=='held' else '')" 2>/dev/null)
            if [ -n "$HELD" ]; then rec "decline-$ID" "$RESULTS/mr-$ID-decline.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$HELD/reject"; fi
          done < "$RESULTS/mr-sentences.tsv"
          PRE=$(python3 -c "import json; print(json.load(open('$RESULTS/mr-preheld.json')).get('actionId') or '')" 2>/dev/null)
          if [ -n "$PRE" ]; then rec decline-preheld "$RESULTS/mr-preheld-decline.json" "${M[@]}" -X POST -d '{}' "$BASE/actions/$PRE/reject"; fi
          rec final-receivables "$RESULTS/mr-final-receivables.json" "${M[@]}" "$BASE/engine/receivables?party=Mokoena"
          rec final-pending "$RESULTS/mr-final-pending.json" "${M[@]}" "$BASE/actions/pending"
          rec status-end "$RESULTS/mr-status-end.json" "${A[@]}" "$BASE/admin/engine/status"
          python3 tools/model-run-judge.py "$RESULTS" tools/model-run-sentences.json "${{ github.sha }}" > "$RESULTS/model-run.json"
          mkdir -p ops
          cp "$RESULTS/model-run.json" ops/staging-model-run-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts 2>/dev/null
          git add ops/staging-model-run-last.json
          git commit -m "Staging model-backed run record (sentences, HTTP statuses, outcomes and pass or fail only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          echo "model run record pushed: rc=$PUSHRC"
          exit $PUSHRC

      - name: Identity - read what the real objects report about their own name (read only)
        if: env.MODE == 'identity'
        env:
          EXPECT_COMMIT: ${{ github.sha }}
          OUT: ${{ github.workspace }}/staging-identity-result.json
        run: |
          # business-object.ts refuses a claim that does not match the name an object was addressed by, but only if the runtime tells the object that name. tools/staging-identity.py reads /admin/health on the real
          # staging objects (GET only, no key printed) and records the answer. It stops, reading no object, if staging is not running THIS commit. Records to the BRANCH, never to main (a push to main deploys production).
          RC=0
          python3 tools/staging-identity.py || RC=$?
          if [ -f "$OUT" ]; then
            mkdir -p ops
            cp "$OUT" ops/staging-identity-last.json
            git config user.name "staging-workflow"
            git config user.email "noreply@github.com"
            git add ops/staging-identity-last.json
            git commit -m "Staging object identity check record (read only: what the real staging objects report about their own name)" || echo "nothing to record"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          exit $RC

      - name: Restore proof, part 2 (restore the older snapshot onto the migrated real object and have the judge decide)
        if: env.MODE == 'restore-proof'
        env:
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          # On 2026-11-02 (run 41445346938) restoring an older snapshot onto a table that had gained a column reported a false failure. By now the deploy has added the probe column to customers on the real object;
          # restore the snapshot taken before it, then read everything the judge needs. Nothing here can end the step before the judge runs and a record is ALWAYS committed (the first attempt, run 41587913275, died
          # before recording and left no evidence). Records to the BRANCH it ran on and fails the run unless every check holds.
          set +e
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY")
          B=staging-two
          call() { name=$1; out=$2; shift 2; CODE=$(curl -s --max-time 300 -o "$out" -w '%{http_code}' "$@"); rc=$?; echo "$name curl_exit=$rc http=$CODE" | tee -a "$RESULTS/rp-calls.txt"; }
          jcall() { name=$1; out=$2; shift 2; call "$name" "$out" "${A[@]}" -H "X-Target-Business: $B" "$@"; }
          SNAP=$(sed -n 's/.*"snapshot" *: *"\([^"]*\)".*/\1/p' "$RESULTS/rp-pre-snapshot.json" 2>/dev/null | head -n 1)
          echo "restoring the pre-deploy snapshot: ${SNAP:-NONE}"
          call health "$RESULTS/rp-health-commit.json" "$BASE/health"
          jcall manifest-before "$RESULTS/rp-manifest-before.json" "$BASE/admin/migration/manifest"
          jcall engine-before "$RESULTS/rp-engine-before.json" "$BASE/admin/engine/status"
          call restore "$RESULTS/rp-restore.json" -X POST "${A[@]}" -H "X-Target-Business: $B" -H "Content-Type: application/json" -d "{\"snapshot\":\"$SNAP\",\"confirm\":\"$B\"}" "$BASE/admin/backup/restore"
          printf '%s' "$CODE" > "$RESULTS/rp-restore-code.txt"
          jcall manifest-after "$RESULTS/rp-manifest-after.json" "$BASE/admin/migration/manifest"
          jcall retry "$RESULTS/rp-retry.json" -X POST "$BASE/admin/schema/retry"
          jcall health-final "$RESULTS/rp-health-final.json" "$BASE/admin/health"
          jcall engine-after "$RESULTS/rp-engine-after.json" "$BASE/admin/engine/status"
          for X in staging-two staging-co; do
            call "status-$X" "$RESULTS/rp-backup-status-$X.json" "${A[@]}" -H "X-Target-Business: $X" "$BASE/admin/backup/status"
            call "list-$X" "$RESULTS/rp-backup-list-$X.json" "${A[@]}" -H "X-Target-Business: $X" "$BASE/admin/backup/list"
          done
          RC=0
          python3 tools/restore-proof-judge.py "$RESULTS" "$SCHEMA_PROBE_COLUMN" "$EXPECT_COMMIT" || RC=$?
          mkdir -p ops
          if [ -f "$RESULTS/restore-proof.json" ]; then
            cp "$RESULTS/restore-proof.json" ops/staging-restore-proof-last.json
          else
            printf '{"all_ok": false, "failed": ["the judge did not produce a record"], "details": {"note": "the judge did not produce a record"}}\n' > ops/staging-restore-proof-last.json
            RC=1
          fi
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          # The temporary migration step regenerated two TRACKED files (tools/gen-baseline.js) and git refuses to rebase over unstaged changes; the branch also advances while a run is going (the proof-tests record).
          # A plain pull and push therefore left no record at all (run 41591517170, whose code was identical to the run that recorded). Put the files back, then retry the rebase and push: an unrecorded proof is not a proof.
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts
          git add ops/staging-restore-proof-last.json
          git commit -m "Staging restore re-proof record (the restore-verification fix on a real object; ids, counts and results only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          exit "$PUSHRC"

      - name: Drill - recover by removing the broken step and redeploying
        id: recover
        if: env.MODE == 'gate-drill'
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          rm -f worker/migrations/0990_gate_drill_broken.sql
          node tools/gen-baseline.js
          ( cd worker && wrangler deploy --config wrangler.staging.toml )
          EXPECTED=$(ls worker/migrations/*.sql | sed -E 's#.*/([0-9]{4})_.*#\1#' | sort | tail -1 | sed -E 's/^0+//')
          echo "after the recovery the newest step is: $EXPECTED"
          for b in staging-co staging-two; do
            for attempt in $(seq 1 24); do
              curl -s "$BASE/admin/health" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: $b" > "$RESULTS/recovered-health-$b.json"
              python3 -c "import json,sys; d=json.load(open('$RESULTS/recovered-health-$b.json')); s=d.get('schema') or {}; sys.exit(0 if (s.get('latestKnownStep') == $EXPECTED and not s.get('error') and not s.get('pending')) else 1)" 2>/dev/null && break
              sleep 15
            done
            curl -s "$BASE/admin/migration/manifest" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $b" > "$RESULTS/recovered-after-$b.json"
          done
          python3 tools/gate-judge.py "$RESULTS" "$EXPECTED" recovered

      - name: Drill - record the result and judge it
        if: always() && env.MODE == 'gate-drill'
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, datetime
          r = os.environ["RESULTS"]
          def load(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return {}
          caught, recovered = load("gate.json"), load("recovered.json")
          businesses = caught.get("businesses") or {}
          detected = bool(businesses) and caught.get("ok") is False and all(any("gate_drill_broken" in p for p in (b.get("problems") or [])) for b in businesses.values())
          healed = recovered.get("ok") is True
          out = {"when": datetime.datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7],
                 "the_gate_caught_the_broken_step_in_every_business": detected, "after_removing_it_every_business_recovered": healed,
                 "drill_passed": detected and healed, "while_broken": caught, "after_recovery": recovered}
          json.dump(out, open("ops/staging-gate-drill-last.json", "w"), indent=1)
          open(os.path.join(r, "drill.json"), "w").write(json.dumps({"drill_passed": detected and healed}))
          PY
          # The drill regenerated a TRACKED file and added a file that must never be committed: put both back before committing (git refuses to rebase over unstaged changes).
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts
          rm -f worker/migrations/0990_gate_drill_broken.sql
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git add ops/staging-gate-drill-last.json
          git commit -m "Staging gate drill record (ids and results only)" || echo "nothing to record"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          python3 -c "import json,os,sys; sys.exit(0 if json.load(open(os.path.join(os.environ['RESULTS'],'drill.json')))['drill_passed'] else 1)"

      - name: Measure the Durable Object on staging
        if: env.MODE == 'rehearsal'
        id: trial
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          curl -s -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/trial-do?n=20&hint=weur&name=staging-a&repeat=4" > "$RESULTS/trial-do.json"
          curl -s -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/trial-d1?n=10" > "$RESULTS/trial-d1.json"

      - name: Measure what a Durable Object's SQLite does about transactions
        id: tx
        if: env.MODE == 'rehearsal'
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          curl -s "$BASE/debug/trial-tx" -H "X-Admin-Key: $STAGING_ADMIN_KEY" > "$RESULTS/tx.json"

      - name: Exercise two businesses end to end
        if: env.MODE == 'rehearsal'
        id: e2e
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          cat > "$RESULTS/mkcookie.py" <<'PY'
          import os, json, hmac, hashlib, base64, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          body = {"email": os.environ["EMAIL"], "exp": int(time.time() * 1000) + 3600000}
          if os.environ.get("BIZ"):
              body["b"] = os.environ["BIZ"]
          p = b(json.dumps(body, separators=(",", ":")).encode())
          s = b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest())
          print("office_session=" + p + "." + s)
          PY
          COOKIE_A=$(EMAIL="staging-owner@example.com" BIZ="staging-co" python3 "$RESULTS/mkcookie.py")
          COOKIE_B=$(EMAIL="staging-two-owner@example.com" BIZ="staging-two" python3 "$RESULTS/mkcookie.py")
          COOKIE_WRONG=$(EMAIL="staging-owner@example.com" BIZ="staging-two" python3 "$RESULTS/mkcookie.py")
          COOKIE_NOB=$(EMAIL="staging-owner@example.com" BIZ="" python3 "$RESULTS/mkcookie.py")
          echo "::add-mask::$COOKIE_A"; echo "::add-mask::$COOKIE_B"; echo "::add-mask::$COOKIE_WRONG"; echo "::add-mask::$COOKIE_NOB"
          printf '%s' "$COOKIE_A" > "$RESULTS/cookie.txt"
          list() { curl -s -o "$2" -w '%{http_code}' -H "Cookie: $1" "$BASE/customers"; }
          upload() { curl -s -o "$3" -w '%{http_code}' -X POST -H "Cookie: $1" -F "csv=@$2;type=text/csv" "$BASE/files/customers-csv-import"; }
          printf 'name\nStaging Customer One\nStaging Customer Two\n' > "$RESULTS/a.csv"
          printf 'name\nSecond Company Customer\n' > "$RESULTS/b.csv"
          S_IMPORT_A=$(upload "$COOKIE_A" "$RESULTS/a.csv" "$RESULTS/import-a.json")
          S_IMPORT_B=$(upload "$COOKIE_B" "$RESULTS/b.csv" "$RESULTS/import-b.json")
          S_LIST_A=$(list "$COOKIE_A" "$RESULTS/list-a.json")
          S_LIST_B=$(list "$COOKIE_B" "$RESULTS/list-b.json")
          # ISOLATION, asked by SEARCH: each business must find its own customers and NONE of the other's. (It used to look for a name in the first 50 customers, which stopped working when the load tests left 26,000 customers in
          # staging: page one was full of other names and the check came back false for a reason that had nothing to do with isolation.)
          search() { curl -s -o "$2" -w '%{http_code}' -G -H "Cookie: $1" --data-urlencode "search=$3" "$BASE/customers"; }
          search "$COOKIE_A" "$RESULTS/sa-own.json" "Staging Customer" > /dev/null
          search "$COOKIE_B" "$RESULTS/sb-own.json" "Second Company" > /dev/null
          search "$COOKIE_A" "$RESULTS/sa-cross.json" "Second Company" > /dev/null
          search "$COOKIE_B" "$RESULTS/sb-cross.json" "Staging Customer" > /dev/null
          S_WRONG=$(list "$COOKIE_WRONG" "$RESULTS/list-wrong.json")
          S_NOB=$(list "$COOKIE_NOB" "$RESULTS/list-nob.json")
          S_STRANGER=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/customers")
          S_NAMELESS=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/customers")
          for pair in "staging-co:FIRST only" "staging-two:SECOND only"; do
            curl -s -o /dev/null -X POST "$BASE/debug/kv-set" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: ${pair%%:*}" -H "Content-Type: application/json" -d "{\"key\":\"customer:1\",\"value\":{\"note\":\"${pair#*:}\"}}"
          done
          curl -s -o "$RESULTS/notes-a.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" "$BASE/debug/customer-notes?customerId=1"
          curl -s -o "$RESULTS/notes-b.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-two" "$BASE/debug/customer-notes?customerId=1"
          : > "$RESULTS/times.txt"
          for i in 1 2 3 4 5; do curl -s -o /dev/null -w '%{time_total}\n' -H "Cookie: $COOKIE_A" "$BASE/customers" >> "$RESULTS/times.txt"; done
          S_IMPORT_A="$S_IMPORT_A" S_IMPORT_B="$S_IMPORT_B" S_LIST_A="$S_LIST_A" S_LIST_B="$S_LIST_B" S_WRONG="$S_WRONG" S_NOB="$S_NOB" S_STRANGER="$S_STRANGER" S_NAMELESS="$S_NAMELESS" python3 - <<'PY' > "$RESULTS/e2e.json"
          import os, json
          r = os.environ["RESULTS"]
          def names(f):
              try:
                  return sorted(c["name"] for c in json.load(open(os.path.join(r, f))).get("items", []))
              except Exception:
                  return None
          a, b = names("list-a.json"), names("list-b.json")
          sa_own, sb_own, sa_cross, sb_cross = names("sa-own.json"), names("sb-own.json"), names("sa-cross.json"), names("sb-cross.json")
          times = [float(x) for x in open(os.path.join(r, "times.txt")).read().split()]
          note_a, note_b = open(os.path.join(r, "notes-a.json")).read(), open(os.path.join(r, "notes-b.json")).read()
          notes_isolated = "FIRST only" in note_a and "SECOND only" not in note_a and "SECOND only" in note_b and "FIRST only" not in note_b
          isolated = bool(None not in (sa_own, sb_own, sa_cross, sb_cross) and "Staging Customer One" in sa_own and "Staging Customer Two" in sa_own and "Second Company Customer" in sb_own
                          and sa_cross == [] and sb_cross == [])
          print(json.dumps({
              "imports": {"first_business": os.environ["S_IMPORT_A"], "second_business": os.environ["S_IMPORT_B"]},
              "lists": {"first_business": os.environ["S_LIST_A"], "second_business": os.environ["S_LIST_B"]},
              "each_business_sees_only_its_own_customers": isolated,
              "isolation_by_search": {"first_finds_its_own": len(sa_own) if sa_own is not None else None, "second_finds_its_own": len(sb_own) if sb_own is not None else None, "first_finds_of_the_others": len(sa_cross) if sa_cross is not None else None, "second_finds_of_the_others": len(sb_cross) if sb_cross is not None else None},
              "same_note_key_in_both_businesses_stays_separate": notes_isolated,
              "first_business_customer_count": len(a) if a is not None else None,
              "second_business_customer_count": len(b) if b is not None else None,
              "refused": {"owner_session_placed_in_the_other_business": os.environ["S_WRONG"], "session_with_no_business": os.environ["S_NOB"], "stranger": os.environ["S_STRANGER"], "admin_call_naming_no_business": os.environ["S_NAMELESS"]},
              "five_list_calls_seconds_from_a_US_runner": times,
          }))
          PY
          # A false check FAILS the step: until 2026-10-14 these results were only recorded, so a business that could see another's customers would have looked like a step that passed.
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RESULTS"], "e2e.json")))
          expected = {"owner_session_placed_in_the_other_business": "403", "session_with_no_business": "401", "stranger": "401", "admin_call_naming_no_business": "400"}
          problems = []
          if d.get("each_business_sees_only_its_own_customers") is not True: problems.append("each_business_sees_only_its_own_customers")
          if d.get("same_note_key_in_both_businesses_stays_separate") is not True: problems.append("same_note_key_in_both_businesses_stays_separate")
          if d.get("imports") != {"first_business": "200", "second_business": "200"}: problems.append("imports")
          if d.get("lists") != {"first_business": "200", "second_business": "200"}: problems.append("lists")
          if d.get("refused") != expected: problems.append("refused")
          print("end-to-end checks that did not hold:", problems)
          sys.exit(1 if problems else 0)
          PY

      - name: Verify the business objects migrated their schema on Cloudflare
        if: env.MODE == 'rehearsal'
        id: schema
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          for b in staging-co staging-two; do
            curl -s "$BASE/admin/health" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: $b" > "$RESULTS/schema-health-$b.json"
            curl -s "$BASE/admin/migration/manifest" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $b" > "$RESULTS/schema-after-$b.json"
          done
          python3 - <<'PY' > "$RESULTS/schema.json"
          import json, os
          r = os.environ["RESULTS"]
          probe, column = os.environ.get("SCHEMA_PROBE"), os.environ.get("SCHEMA_PROBE_COLUMN")
          def load(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return {}
          def table(m, name):
              return next((t for t in (m.get("tables") or []) if t.get("name") == name), {})
          out = {"step_added_to_the_build_only": probe, "column": column, "businesses": {}}
          for b in ("staging-co", "staging-two"):
              h = (load("schema-health-%s.json" % b)).get("schema") or {}
              before, after = table(load("schema-before-%s.json" % b), "customers"), table(load("schema-after-%s.json" % b), "customers")
              applied = ((h.get("lastMigration") or {}).get("applied")) or []
              out["businesses"][b] = {
                  "migrated_by_this_deploy": probe in applied, "last_migration_applied": applied,
                  "nothing_pending": h.get("pending") == [], "no_error": h.get("error") is None,
                  "steps_applied": h.get("appliedSteps"), "steps_this_code_knows": h.get("latestKnownStep"), "steps_from_earlier_runs_this_code_does_not_know": h.get("unknownApplied"),
                  "column_is_there": column in [c.get("name") for c in (after.get("columns") or [])],
                  "column_was_not_there_before": column not in [c.get("name") for c in (before.get("columns") or [])],
                  "customers_before": before.get("count"), "customers_after": after.get("count"),
                  "data_kept": before.get("count") is not None and after.get("count") is not None and after.get("count") >= before.get("count"),
              }
          out["all_migrated_and_data_kept"] = all(v["migrated_by_this_deploy"] and v["nothing_pending"] and v["no_error"] and v["column_is_there"] and v["data_kept"] for v in out["businesses"].values())
          print(json.dumps(out))
          PY

      - name: Onboarding and imports on Cloudflare (a real owner session, a real Durable Object)
        if: env.MODE == 'rehearsal'
        id: onboarding
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          COOKIE=$(cat "$RESULTS/cookie.txt")
          TAG="r${GITHUB_RUN_ID}"
          J=(-H "Cookie: $COOKIE")
          get() { curl -s -o "$RESULTS/$2" -w '%{http_code}' "${J[@]}" "$BASE$1" > "$RESULTS/$2.status"; }
          post_step() { curl -s -o "$RESULTS/$3" -w '%{http_code}' -X POST "${J[@]}" -H "Content-Type: application/json" -d "{\"step\":\"$1\",\"status\":\"$2\"}" "$BASE/onboarding/step" > "$RESULTS/$3.status"; }
          upload() { curl -s -o "$RESULTS/$3" -w '%{http_code}' -X POST "${J[@]}" -F "csv=@$RESULTS/$2;type=text/csv" "$BASE$1" > "$RESULTS/$3.status"; }
          BOM=$(printf '\xef\xbb\xbf')
          get /onboarding ob-state.json
          curl -s -o /dev/null -w '%{http_code}' "$BASE/onboarding" > "$RESULTS/ob-anon.status"
          post_step profile skipped ob-skip1.json
          post_step profile skipped ob-skip2.json
          get /onboarding ob-after-skip.json
          post_step profile pending ob-reset.json
          post_step nonsense done ob-bad.json
          printf '%sName;Role\nInstaller %s A;Installer\nDriver %s B;Driver\n' "$BOM" "$TAG" "$TAG" > "$RESULTS/team.csv"
          printf 'Supplier\nSupplier %s One\nSupplier %s Two\n' "$TAG" "$TAG" > "$RESULTS/suppliers.csv"
          printf 'Material,Category\nVinyl %s,Flooring\nScreed %s,\n' "$TAG" "$TAG" > "$RESULTS/products.csv"
          printf '%sInvoice No.;Customer Name;Amount (incl. VAT);Balance;Invoice Date\n%s-1;Import Client %s;R1 500,00;R0,00;2026-10-01\n%s-2;Import Client %s;R2 300,50;R2 300,50;2026-10-02\n' "$BOM" "$TAG" "$TAG" "$TAG" "$TAG" > "$RESULTS/invoices.csv"
          printf 'Customer,Total\nNobody,100\n' > "$RESULTS/unknown-paid.csv"
          # A list of four DIFFERENT people with look-alike names (this run's tag keeps them new): only an EXACT name matches; the look-alikes must stay separate customers and be reported, not folded into each other.
          printf 'Name\nMrs Nkosi %s\nMr Nkosi %s\nJohn Smithson %s\nJohn Smith %s\n' "$TAG" "$TAG" "$TAG" "$TAG" > "$RESULTS/lookalikes.csv"
          upload /files/team-csv-import team.csv imp-team-1.json;           upload /files/team-csv-import team.csv imp-team-2.json
          upload /files/suppliers-csv-import suppliers.csv imp-sup-1.json;   upload /files/suppliers-csv-import suppliers.csv imp-sup-2.json
          upload /files/products-csv-import products.csv imp-pro-1.json;     upload /files/products-csv-import products.csv imp-pro-2.json
          upload /files/invoices-csv-import invoices.csv imp-inv-1.json;     upload /files/invoices-csv-import invoices.csv imp-inv-2.json
          upload /files/invoices-csv-import unknown-paid.csv imp-inv-refused.json
          upload /files/customers-csv-import lookalikes.csv imp-cust-1.json;   upload /files/customers-csv-import lookalikes.csv imp-cust-2.json
          get /onboarding ob-final.json
          python3 - <<'PY' > "$RESULTS/onboarding.json"
          import json, os
          r = os.environ["RESULTS"]
          def read(n):
              try:
                  return json.load(open(os.path.join(r, n)))
              except Exception:
                  return None
          def status(n):
              try:
                  return open(os.path.join(r, n + ".status")).read().strip()
              except Exception:
                  return None
          st, after, final = read("ob-state.json") or {}, read("ob-after-skip.json") or {}, read("ob-final.json") or {}
          step = lambda doc, i: next((x for x in (doc.get("steps") or []) if x.get("id") == i), {})
          ids = ["profile", "customers", "invoices", "team", "suppliers", "products", "try_it"]
          s1, s2, rs = read("ob-skip1.json"), read("ob-skip2.json"), read("ob-reset.json") or {}
          i1, i2, ir = read("imp-inv-1.json") or {}, read("imp-inv-2.json") or {}, read("imp-inv-refused.json") or {}
          pair = lambda a, b: (read("imp-%s-1.json" % a) or {}, read("imp-%s-2.json" % a) or {})
          t1, t2 = pair("team", 0); u1, u2 = pair("sup", 0); p1, p2 = pair("pro", 0); k1, k2 = pair("cust", 0)
          prof = step(after, "profile")
          out = {
              "onboarding_read_ok": status("ob-state.json") == "200" and [x.get("id") for x in st.get("steps", [])] == ids,
              "steps_name_their_upload_route": [x.get("upload") for x in st.get("steps", [])] == [None, "/files/customers-csv-import", "/files/invoices-csv-import", "/files/team-csv-import", "/files/suppliers-csv-import", "/files/products-csv-import", None],
              "signed_out_is_refused": status("ob-anon") == "401",
              "marking_a_step_works_and_persists": status("ob-skip1.json") == "200" and (prof.get("status") == "skipped" or (prof.get("status") == "done" and prof.get("source") == "data")),
              "marking_twice_is_the_same_as_once": s1 is not None and s1 == s2,
              "resetting_a_step_works": status("ob-reset.json") == "200" and step(rs, "profile").get("status") in ("pending", "done"),
              "a_bad_step_is_refused": status("ob-bad.json") == "400",
              "team_import_created_then_matched": status("imp-team-1.json") == "200" and t1.get("created") == 2 and t1.get("matched") == 0 and t2.get("created") == 0 and t2.get("matched") == 2,
              "team_roles_were_read": (t1.get("columns") or {}).get("found", {}).get("role") == "Role",
              "suppliers_import_created_then_matched": u1.get("created") == 2 and u2.get("created") == 0 and u2.get("matched") == 2,
              "products_import_created_then_matched": p1.get("created") == 2 and p2.get("created") == 0 and p2.get("matched") == 2,
              "other_tools_invoice_export_imported_and_held": status("imp-inv-1.json") == "200" and i1.get("imported") == 1 and i1.get("heldForConfirmation") == 1 and (i1.get("columns") or {}).get("found", {}).get("total") == "Amount (incl. VAT)",
              "importing_the_invoice_file_again_adds_nothing": i2.get("imported") == 0 and i2.get("heldForConfirmation") == 0 and i2.get("alreadyImported") == 2,
              "a_file_that_cannot_say_what_is_paid_is_refused": status("imp-inv-refused.json") == "400" and "can't tell which invoices are already paid" in (ir.get("error") or ""),
              "a_list_of_look_alike_people_creates_every_one_of_them": k1.get("created") == 4 and k1.get("matched") == 0,
              "look_alikes_are_reported_not_merged": k1.get("possibleDuplicateCount") == 2 and [x.get("asked", "").split(" r")[0] for x in k1.get("possibleDuplicates", [])] == ["Mr Nkosi", "John Smith"],
              "importing_the_same_customer_list_again_changes_nothing": k2.get("created") == 0 and k2.get("matched") == 4 and k2.get("possibleDuplicateCount") == 0,
              "steps_are_done_because_of_the_data_after_the_imports": all(step(final, i).get("status") == "done" for i in ("invoices", "team", "suppliers", "products")),
          }
          out["answers"] = {"team": [t1, t2], "invoices": [i1, i2], "state_after": [{"id": x.get("id"), "status": x.get("status"), "source": x.get("source")} for x in final.get("steps", [])]}
          print(json.dumps(out))
          PY
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RESULTS"], "onboarding.json")))
          failed = [k for k, v in d.items() if k != "answers" and v is not True]
          print("onboarding and import checks that did not hold:", failed)
          sys.exit(1 if failed else 0)
          PY

      - name: Starting a business from the app on Cloudflare (a signup proof, a real Durable Object)
        if: env.MODE == 'rehearsal'
        id: signup
        continue-on-error: true
        run: |
          # The page itself needs a real Google sign-in, which a runner cannot do. What CAN be done for real: mint the signed proof the page carries (the staging session secret is derived in this workflow), post the form to the real
          # staging Worker, and check the real D1, the real Durable Object, the real session and the real routing. Caps are raised in the staging config so repeated rehearsals from one runner address are not refused.
          BASE="https://${SLUG}.websitehub.co.za"
          TAG="r${GITHUB_RUN_ID}"
          EMAIL="signup-owner-${TAG}@example.com"
          proof() {
            python3 - "$1" <<'PY'
          import base64, hashlib, hmac, json, os, sys, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          p = b(json.dumps({"purpose": "signup", "email": sys.argv[1], "exp": int(time.time() * 1000) + 600000}, separators=(",", ":")).encode())
          print(p + "." + b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), ("signup." + p).encode(), hashlib.sha256).digest()))
          PY
          }
          form() { curl -s -D "$RESULTS/$1.headers" -o "$RESULTS/$1.body" -w '%{http_code}' -X POST --data-urlencode "token=$2" --data-urlencode "business_name=$3" ${4:+--data-urlencode "agree=on"} "$BASE/auth/signup" > "$RESULTS/$1.status"; }
          form su-first "$(proof "$EMAIL")" "Signup Floors $TAG" yes
          form su-again "$(proof "$EMAIL")" "A Different Name $TAG" yes
          form su-garbage "garbage" "Nobody $TAG" yes
          form su-untick "$(proof "untick-${TAG}@example.com")" "Untick Co $TAG"
          SESSION=$(python3 -c "import re,sys,urllib.parse as u; h=open('$RESULTS/su-first.headers').read(); m=re.search(r'(?im)^location:\\s*(\\S+)', h); print(u.parse_qs(u.urlparse(m.group(1)).query).get('token',[''])[0] if m else '')")
          J=(-H "Cookie: office_session=$SESSION")
          curl -s -o "$RESULTS/su-me.json" "${J[@]}" "$BASE/auth/me"
          curl -s -o "$RESULTS/su-customers.json" -w '%{http_code}' "${J[@]}" "$BASE/customers" > "$RESULTS/su-customers.status"
          curl -s -o "$RESULTS/su-onboarding.json" -w '%{http_code}' "${J[@]}" "$BASE/onboarding" > "$RESULTS/su-onboarding.status"
          curl -s -o "$RESULTS/su-directory.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory"
          curl -s -o "$RESULTS/su-plans.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory/plans"
          curl -s -o "$RESULTS/su-health.json" "$BASE/health"
          # Bringing a trial back (worker/src/freetrial.ts): extend it by 7 days, convert it to the standard plan, be refused a repeat, and be refused without the confirmation key.
          BID=$(python3 -c "import json; print(next((b['id'] for b in json.load(open('$RESULTS/su-directory.json')).get('businesses', []) if b.get('name') == 'Signup Floors $TAG'), ''))")
          trial() { curl -s -o "$RESULTS/$1.json" -w '%{http_code}' -X POST -H "X-Admin-Key: $STAGING_ADMIN_KEY" ${3:+-H "X-Admin-Confirm: $STAGING_CONFIRM_KEY"} -H "Content-Type: application/json" -d "$2" "$BASE/debug/directory/trial" > "$RESULTS/$1.status"; }
          dirnow() { curl -s -o "$RESULTS/$1.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" "$BASE/debug/directory"; }
          trial tr-nokey "{\"business\":\"$BID\",\"action\":\"extend\",\"days\":7}"
          trial tr-extend "{\"business\":\"$BID\",\"action\":\"extend\",\"days\":7}" yes
          dirnow su-directory-extended
          trial tr-convert "{\"business\":\"$BID\",\"action\":\"convert\",\"plan\":\"standard\"}" yes
          dirnow su-directory-converted
          trial tr-again "{\"business\":\"$BID\",\"action\":\"convert\",\"plan\":\"standard\"}" yes
          trial tr-bad "{\"business\":\"$BID\",\"action\":\"delete\"}" yes
          # The name typed at signup must be in the business's OWN profile (profile-seed.ts), read through the real object.
          curl -s -o "$RESULTS/su-profile.json" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: $BID" "$BASE/debug/business-profile"
          # Team management (worker/src/team.ts) on the REAL object: the owner adds a person, who is then seen in the list and the directory; a session minted for that person shows that DEACTIVATING cuts their access at once and reactivating
          # restores it; and the refusals: a duplicate, an address that belongs to another business (a second signup makes one), and a co-owner who can be added but never deactivated.
          TEAM="team-member-${TAG}@example.com"; COOWNER="coowner-${TAG}@example.com"; OTHER="signup-owner2-${TAG}@example.com"
          msession() {
            python3 - "$1" "$BID" <<'PY'
          import base64, hashlib, hmac, json, os, sys, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          p = b(json.dumps({"email": sys.argv[1], "exp": int(time.time() * 1000) + 600000, "b": sys.argv[2]}, separators=(",", ":")).encode())
          print(p + "." + b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest()))
          PY
          }
          api() { curl -s -o "$RESULTS/$1.json" -w '%{http_code}' -X "$2" -H "Cookie: office_session=$3" -H "Content-Type: application/json" ${5:+-d "$5"} "$BASE$4" > "$RESULTS/$1.status"; }
          api tm-add POST "$SESSION" /team "{\"email\":\"$TEAM\",\"role\":\"installer\",\"firstName\":\"Tina\",\"surname\":\"Added\"}"
          api tm-list GET "$SESSION" /team
          MID=$(python3 -c "import json; print(next((m['id'] for m in json.load(open('$RESULTS/tm-list.json')).get('members', []) if m['email'] == '$TEAM'), ''))")
          MSESS=$(msession "$TEAM")
          api tm-m-before GET "$MSESS" /projects
          api tm-m-team GET "$MSESS" /team
          dirnow tm-directory
          api tm-deact POST "$SESSION" "/team/$MID/deactivate" '{}'
          api tm-m-after GET "$MSESS" /projects
          api tm-react POST "$SESSION" "/team/$MID/reactivate" '{}'
          api tm-m-back GET "$MSESS" /projects
          api tm-role PATCH "$SESSION" "/team/$MID" '{"role":"accountant"}'
          api tm-dup POST "$SESSION" /team "{\"email\":\"$TEAM\",\"role\":\"installer\",\"firstName\":\"Tina\",\"surname\":\"Added\"}"
          form su-second "$(proof "$OTHER")" "Second Floors $TAG" yes
          api tm-conflict POST "$SESSION" /team "{\"email\":\"$OTHER\",\"role\":\"installer\",\"firstName\":\"Cara\",\"surname\":\"Conflict\"}"
          api tm-co POST "$SESSION" /team "{\"email\":\"$COOWNER\",\"role\":\"owner\",\"firstName\":\"Cole\",\"surname\":\"Coowner\"}"
          api tm-list2 GET "$SESSION" /team
          COID=$(python3 -c "import json; print(next((m['id'] for m in json.load(open('$RESULTS/tm-list2.json')).get('members', []) if m['email'] == '$COOWNER'), ''))")
          api tm-co-deact POST "$SESSION" "/team/$COID/deactivate" '{}'
          # INVITATIONS (worker/src/directory.ts, signup.ts handleJoinPost) on the REAL directory and object: the owner invites, the invitation WAITS (nothing about the team changes), the person accepts with the signed proof, a revoked
          # invitation cannot be accepted, and another address cannot accept someone else's.
          INVITEE="invitee-${TAG}@example.com"; REVOKEE="revokee-${TAG}@example.com"; STRANGER="stranger-${TAG}@example.com"
          joinform() { curl -s -D "$RESULTS/$1.headers" -o "$RESULTS/$1.body" -w '%{http_code}' -X POST --data-urlencode "token=$2" --data-urlencode "invitation=$3" "$BASE/auth/join" > "$RESULTS/$1.status"; }
          idof() { python3 -c "import json,sys; print(next((i['id'] for i in json.load(open('$RESULTS/$1.json')).get('invitations', []) if i['email'] == '$2'), ''))"; }
          api inv-add POST "$SESSION" /team/invite "{\"email\":\"$INVITEE\",\"role\":\"accountant\",\"firstName\":\"Ivy\",\"surname\":\"Invitee\"}"
          api inv-add2 POST "$SESSION" /team/invite "{\"email\":\"$REVOKEE\",\"role\":\"installer\",\"firstName\":\"Rex\",\"surname\":\"Revokee\"}"
          api inv-list GET "$SESSION" /team
          IID=$(idof inv-list "$INVITEE"); RID2=$(idof inv-list "$REVOKEE")
          api inv-revoke POST "$SESSION" "/team/invitations/$RID2/revoke" '{}'
          joinform inv-revoked "$(proof "$REVOKEE")" "$RID2"
          joinform inv-stranger "$(proof "$STRANGER")" "$IID"
          joinform inv-join "$(proof "$INVITEE")" "$IID"
          ISESS=$(python3 -c "import re,sys,urllib.parse as u; h=open('$RESULTS/inv-join.headers').read(); m=re.search(r'(?im)^location:\\s*(\\S+)', h); print(u.parse_qs(u.urlparse(m.group(1)).query).get('token',[''])[0] if m else '')")
          api inv-me GET "$ISESS" /auth/me
          joinform inv-join-again "$(proof "$INVITEE")" "$IID"
          api inv-list2 GET "$SESSION" /team
          # ROLES (worker/src/auth.ts ROLE_CAPABILITIES): the owner gives someone ADMIN and someone SALES, and acts as each on the REAL object. Sales sees jobs but no money; admin sees money and jobs but cannot manage the team or the permissions.
          ADMINM="admin-member-${TAG}@example.com"; SALESM="sales-member-${TAG}@example.com"
          api ro-add-admin POST "$SESSION" /team "{\"email\":\"$ADMINM\",\"role\":\"admin\",\"firstName\":\"Ada\",\"surname\":\"Admin\"}"
          api ro-add-sales POST "$SESSION" /team "{\"email\":\"$SALESM\",\"role\":\"sales\",\"firstName\":\"Sam\",\"surname\":\"Sales\"}"
          ASESS=$(msession "$ADMINM"); SSESS=$(msession "$SALESM")
          api ro-owner-finance GET "$SESSION" /embers/finance
          api ro-admin-jobs GET "$ASESS" /projects
          api ro-admin-finance GET "$ASESS" /embers/finance
          api ro-admin-team GET "$ASESS" /team
          api ro-admin-perms GET "$ASESS" /settings/permissions
          api ro-sales-jobs GET "$SSESS" /projects
          api ro-sales-finance GET "$SSESS" /embers/finance
          api ro-sales-team GET "$SSESS" /team
          api ro-owner-perms GET "$SESSION" /settings/permissions
          # THE EMPTY-BUSINESS HANDOVER (worker/src/signup.ts, emptiness.ts) on the REAL objects: three employees each started their own trial by mistake, and each is invited to this business. X agrees (their empty business is closed and
          # they join); Y has DATA in theirs (never moved: signed in to their own); Z keeps theirs (the invitation is declined). The emptiness question is asked of the real object.
          XE="handover-x-${TAG}@example.com"; YE="handover-y-${TAG}@example.com"; ZE="handover-z-${TAG}@example.com"
          form ho-x-start "$(proof "$XE")" "Handover X $TAG" yes
          form ho-y-start "$(proof "$YE")" "Handover Y $TAG" yes
          form ho-z-start "$(proof "$ZE")" "Handover Z $TAG" yes
          dirnow ho-dir-before
          bsession() {
            python3 - "$1" "$2" <<'PY'
          import base64, hashlib, hmac, json, os, sys, time
          b = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=").decode()
          p = b(json.dumps({"email": sys.argv[1], "exp": int(time.time() * 1000) + 600000, "b": sys.argv[2]}, separators=(",", ":")).encode())
          print(p + "." + b(hmac.new(os.environ["STAGING_SESSION_SECRET"].encode(), p.encode(), hashlib.sha256).digest()))
          PY
          }
          YB=$(python3 -c "import json; print(next((b['id'] for b in json.load(open('$RESULTS/ho-dir-before.json')).get('businesses', []) if b.get('name') == 'Handover Y $TAG'), ''))")
          YSESS=$(bsession "$YE" "$YB")
          printf 'name\nY Customer\n' > "$RESULTS/y.csv"
          curl -s -o "$RESULTS/ho-y-data.json" -w '%{http_code}' -X POST -H "Cookie: office_session=$YSESS" -F "csv=@$RESULTS/y.csv;type=text/csv" "$BASE/files/customers-csv-import" > "$RESULTS/ho-y-data.status"
          api ho-inv-x POST "$SESSION" /team/invite "{\"email\":\"$XE\",\"role\":\"installer\",\"firstName\":\"Xena\",\"surname\":\"Handover\"}"
          api ho-inv-y POST "$SESSION" /team/invite "{\"email\":\"$YE\",\"role\":\"installer\",\"firstName\":\"Yara\",\"surname\":\"Handover\"}"
          api ho-inv-z POST "$SESSION" /team/invite "{\"email\":\"$ZE\",\"role\":\"installer\",\"firstName\":\"Zed\",\"surname\":\"Handover\"}"
          api ho-list GET "$SESSION" /team
          XI=$(idof ho-list "$XE"); YI=$(idof ho-list "$YE"); ZI=$(idof ho-list "$ZE")
          joinx() { curl -s -D "$RESULTS/$1.headers" -o "$RESULTS/$1.body" -w '%{http_code}' -X POST --data-urlencode "token=$2" --data-urlencode "invitation=$3" --data-urlencode "$4" "$BASE/auth/join" > "$RESULTS/$1.status"; }
          joinx ho-x-join "$(proof "$XE")" "$XI" handover=1
          joinx ho-y-join "$(proof "$YE")" "$YI" handover=1
          joinx ho-z-keep "$(proof "$ZE")" "$ZI" keep=1
          XSESS=$(python3 -c "import re,sys,urllib.parse as u; h=open('$RESULTS/ho-x-join.headers').read(); m=re.search(r'(?im)^location:\\s*(\\S+)', h); print(u.parse_qs(u.urlparse(m.group(1)).query).get('token',[''])[0] if m else '')")
          api ho-x-me GET "$XSESS" /auth/me
          api ho-list2 GET "$SESSION" /team
          dirnow ho-dir-after
          # QUOTATIONS AS THEIR OWN SWITCH (worker/src/auth.ts can_make_quotes) on the REAL object. The gate runs BEFORE the handler, so a caller who may edit a quotation gets 404 for one that does not exist, and a caller who may not gets 403:
          # that proves the gate without needing any data. Sales may quote and may not edit an invoice or a customer; an installer may not quote; the owner switches quoting OFF for sales (persisted on the real object) and back ON.
          api qs-sales-quote PATCH "$SSESS" /quotations/999999 '{}'
          api qs-sales-invoice PATCH "$SSESS" /invoices/999999 '{}'
          api qs-sales-customer PATCH "$SSESS" /customers/999999 '{}'
          api qs-installer-quote PATCH "$XSESS" /quotations/999999 '{}'
          api qs-admin-quote PATCH "$ASESS" /quotations/999999 '{}'
          api qs-off PATCH "$SESSION" /settings/permissions '{"role":"sales","capability":"can_make_quotes","granted":false}'
          api qs-sales-quote-off PATCH "$SSESS" /quotations/999999 '{}'
          api qs-admin-quote-after PATCH "$ASESS" /quotations/999999 '{}'
          api qs-on PATCH "$SESSION" /settings/permissions '{"role":"sales","capability":"can_make_quotes","granted":true}'
          api qs-sales-quote-on PATCH "$SSESS" /quotations/999999 '{}'
          api qs-installer-only PATCH "$SESSION" /settings/permissions '{"role":"installer","capability":"can_make_quotes","granted":true}'
          api qs-installer-quote-on PATCH "$XSESS" /quotations/999999 '{}'
          api qs-installer-invoice-on PATCH "$XSESS" /invoices/999999 '{}'
          api qs-installer-reset PATCH "$SESSION" /settings/permissions '{"role":"installer","capability":"can_make_quotes","granted":false}'
          api qs-installer-quote-reset PATCH "$XSESS" /quotations/999999 '{}'
          api qs-grid GET "$SESSION" /settings/permissions
