name: Staging environment

# SHIP_CHECKLIST.md item 5b / item A. A second, separate instance of the application used to try changes (the business object, migrations, restores) without touching real data:
# its own Worker (office-staging-api), database, notes store, file storage and memory index, at office-staging.websitehub.co.za. Durable Objects belong to a Worker, so staging's
# objects are separate from production's by construction. Model usage and limits are the Cloudflare ACCOUNT's, so staging shares them.
#
# Safe to re-run: every resource is looked up before it is created. Admin keys are DERIVED from one repository secret (STAGING_KEY_SEED), so this workflow, CI and any later test
# compute the same keys without anyone copying a random value around; the keys never appear in a log (masked). It writes what it did to ops/staging-last-run.json so the result can be
# read from the repository. Started by hand only.
on:
  # Called by the production pipeline as its STAGING GATE (deploy.yml): the light "gate" mode. Nothing else can start it but a person.
  workflow_call:
    inputs:
      mode:
        type: string
        default: gate
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal = everything; gate = what a migration must pass (as the pipeline runs it); gate-drill = prove the gate stops a deliberately broken step, then recover; load = load test the business objects (staging only); restore-proof = re-prove the restore on a real object; model-run = HELD until Pierre says run it: send a fixed list of sentences to the engine's model interpreter on staging-two and record what the engine did (staging only); ramp = grow one table on staging-two in steps and try a snapshot and a restore at each size (staging only, answers: where does memory run out)"
        type: choice
        options:
          - rehearsal
          - gate
          - gate-drill
          - load
          - identity
          - restore-proof
          - ramp
          - model-run
          - parties-proof
          - quotations-proof
          - stack-proof
        default: rehearsal
      ramp_sizes:
        description: "Ramp mode only: the marker-row counts to try, ascending, separated by spaces (each at most 2000000); the ramp stops at the first size that fails"
        required: false
        default: "20000 40000 80000 120000 160000"
      load_sentences:
        description: "Load mode only: how many real sentences wait on the model while reads are timed (each costs a little; never more than 8)"
        required: false
        default: "5"
      owner_email:
        description: "Optional: a Google account to make an owner of staging (needs the redirect URI added to the Google OAuth client first)"
        required: false
        default: ""

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PROVISION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SLUG: office-staging
      SEED: ${{ secrets.STAGING_KEY_SEED }}
      MODE: ${{ inputs.mode || 'rehearsal' }}
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          npm install -g wrangler@4
          mkdir -p "$RESULTS"

      - name: Derive the staging keys from the seed
        run: |
          derive() { printf '%s' "$2" | openssl dgst -sha256 -hmac "$1" -binary | base64 | tr -d '=+/\n' | cut -c1-43; }
          ADMIN=$(derive "$SEED" admin); CONFIRM=$(derive "$SEED" confirm); SESSION=$(derive "$SEED" session)
          echo "::add-mask::$ADMIN"; echo "::add-mask::$CONFIRM"; echo "::add-mask::$SESSION"
          { echo "STAGING_ADMIN_KEY=$ADMIN"; echo "STAGING_CONFIRM_KEY=$CONFIRM"; echo "STAGING_SESSION_SECRET=$SESSION"; } >> "$GITHUB_ENV"

      - name: Create the database (safe to re-run)
        id: d1
        run: |
          RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=${SLUG}-db" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          EXISTING=$(echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['uuid'] if r else '')")
          if [ -n "$EXISTING" ]; then
            echo "The database already exists: reusing it."
            echo "id=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            OUTPUT=$(wrangler d1 create "${SLUG}-db" --location weur 2>&1)
            echo "$OUTPUT"
            DB_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$DB_ID" ]; then echo "::error::Could not read a database id from wrangler's output."; exit 1; fi
            echo "id=$DB_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the notes store (safe to re-run)
        id: kv
        run: |
          RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          EXISTING=$(echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); m=next((n for n in r if n['title']=='${SLUG}_notes'),None); print(m['id'] if m else '')")
          if [ -n "$EXISTING" ]; then
            echo "The namespace already exists: reusing it."
            echo "id=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            OUTPUT=$(wrangler kv namespace create "${SLUG}_notes" 2>&1)
            echo "$OUTPUT"
            KV_ID=$(echo "$OUTPUT" | grep -i '"id"' | grep -oE '[0-9a-f]{32}' | head -1)
            if [ -z "$KV_ID" ]; then echo "::error::Could not read a namespace id from wrangler's output."; exit 1; fi
            echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the file storage (safe to re-run)
        run: |
          wrangler r2 bucket create "${SLUG}-vault" || echo "The bucket probably exists already, continuing."

      - name: Create the backup bucket (safe to re-run)
        run: |
          wrangler r2 bucket create "${SLUG}-backups" || echo "The bucket probably exists already, continuing."

      - name: Create the memory index (safe to re-run)
        run: |
          wrangler vectorize create "${SLUG}-memory" --dimensions=768 --metric=cosine || echo "The index probably exists already, continuing."

      - name: Look up the zone
        id: zone
        run: |
          RESPONSE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=websitehub.co.za" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          ZONE_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          if [ -z "$ZONE_ID" ]; then echo "::error::Could not find the zone."; exit 1; fi
          echo "id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Create the hostname (safe to re-run)
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.id }}/dns_records?name=${SLUG}.websitehub.co.za" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['result']))")
          if [ "$EXISTING" != "0" ]; then
            echo "The DNS record already exists."
          else
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.id }}/dns_records" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" -d "{\"type\":\"CNAME\",\"name\":\"${SLUG}\",\"content\":\"websitehub.co.za\",\"proxied\":true}"
          fi

      - name: Write staging's Worker configuration
        run: |
          cat > worker/wrangler.staging.toml << EOF
          name = "${SLUG}-api"
          main = "src/index.ts"
          compatibility_date = "2026-07-01"

          [ai]
          binding = "AI"

          [[d1_databases]]
          binding = "OFFICE_DB"
          database_name = "${SLUG}-db"
          database_id = "${{ steps.d1.outputs.id }}"

          [[r2_buckets]]
          binding = "OFFICE_VAULT"
          bucket_name = "${SLUG}-vault"

          [[r2_buckets]]
          binding = "BACKUPS"
          bucket_name = "${SLUG}-backups"

          [[vectorize]]
          binding = "MEMORY"
          index_name = "${SLUG}-memory"

          [[kv_namespaces]]
          binding = "CUSTOMER_NOTES"
          id = "${{ steps.kv.outputs.id }}"

          [vars]
          ENVIRONMENT = "staging"
          ENGINE_REHEARSAL = "1"
          RECORD_TIMINGS = "1"
          PLAN_CACHE_SECONDS = "0"
          BUSINESS_MODE = "object"
          SIGNUP_DAILY_CAP = "1000"
          SIGNUP_IP_DAILY_CAP = "1000"
          # PayFast for the REHEARSAL ONLY: PayFast's own public sandbox merchant, a passphrase invented for this throwaway environment, and the flag that skips PayFast's confirmation call (it cannot succeed for a made-up payment). Production
          # has none of these: its keys are secrets set by the deploy, it is not in live mode until Pierre says so, and live mode ignores the flag anyway (tools/billing.test.js pins all of it).
          PAYFAST_MODE = "sandbox"
          PAYFAST_SANDBOX_MERCHANT_ID = "10000100"
          PAYFAST_SANDBOX_MERCHANT_KEY = "46f0cd694581a"
          PAYFAST_SANDBOX_PASSPHRASE = "rehearsal-passphrase"
          PAYFAST_SKIP_CONFIRM = "1"
          # The per-request "has this business stopped paying" answer is normally remembered for a minute; here nothing is remembered, so the rehearsal sees each change at once.
          ACCESS_CACHE_SECONDS = "0"

          [[routes]]
          pattern = "${SLUG}.websitehub.co.za/*"
          zone_name = "websitehub.co.za"

          [[durable_objects.bindings]]
          name = "TRIAL"
          class_name = "TrialObject"

          [[durable_objects.bindings]]
          name = "BUSINESS"
          class_name = "BusinessObject"

          [[migrations]]
          tag = "trial-v1"
          new_sqlite_classes = ["TrialObject"]

          [[migrations]]
          tag = "business-v1"
          new_sqlite_classes = ["BusinessObject"]
          EOF
          cat worker/wrangler.staging.toml

      - name: Create the tables
        working-directory: worker
        run: wrangler d1 migrations apply OFFICE_DB --remote --config wrangler.staging.toml

      - name: Record the business objects as they are BEFORE the schema step (the previous code is still deployed)
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          mkdir -p "$RESULTS"
          for b in staging-co staging-two; do
            curl -s "$BASE/admin/migration/manifest" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $b" > "$RESULTS/schema-before-$b.json"
          done

      - name: Engine rehearsal, part 1 (staging-two is snapshotted BEFORE the deploy, while the previous code is still live)
        if: env.MODE == 'rehearsal'
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY")
          # The business as it is before migration 0004 can reach it: its manifest was just recorded above, and this is the SNAPSHOT the rollback will be restored from (engine-phase1, docs/decisions/engine-foundation.md).
          curl -s --max-time 300 -X POST "${A[@]}" -H "X-Target-Business: staging-two" "$BASE/admin/backup/run" > "$RESULTS/engine-pre-snapshot.json"
          echo "pre-migration snapshot: $(python3 -c "import json; print(json.load(open('$RESULTS/engine-pre-snapshot.json')).get('snapshot',''))")"

      - name: Restore proof, part 1 (both staging businesses are snapshotted BEFORE the deploy, by the code that is still live)
        if: env.MODE == 'restore-proof'
        continue-on-error: true
        run: |
          set +e
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY")
          # Every call is logged with its curl exit and HTTP status (rp-calls.txt), and nothing here can abort the step: the judge in part 2 reads the log.
          call() { name=$1; out=$2; shift 2; CODE=$(curl -s --max-time 300 -o "$out" -w '%{http_code}' "$@"); rc=$?; echo "$name curl_exit=$rc http=$CODE" | tee -a "$RESULTS/rp-calls.txt"; }
          # The snapshot staging-two's restore will come from, taken before the temporary migration below reaches the real object. Both snapshots are written by the PREVIOUS code, so reading them with the new manifest validator
          # is itself a test of the validator against real manifests (tools/restore-proof-judge.py).
          call pre-snapshot "$RESULTS/rp-pre-snapshot.json" -X POST "${A[@]}" -H "X-Target-Business: staging-two" "$BASE/admin/backup/run"
          call pre-snapshot-staging-co "$RESULTS/rp-pre-snapshot-staging-co.json" -X POST "${A[@]}" -H "X-Target-Business: staging-co" "$BASE/admin/backup/run"

      - name: Add a temporary schema step (staging only, NEVER committed)
        if: env.MODE == 'rehearsal' || env.MODE == 'restore-proof'
        run: |
          # A new migration file that exists only in this run's workspace: it adds a column to a table that already holds data. Its number is per run, so every run migrates the objects once more.
          V=$((1000 + GITHUB_RUN_NUMBER % 8000)); P=$(printf '%04d' "$V")
          printf -- "-- staging rehearsal only: never committed\nALTER TABLE customers ADD COLUMN probe_%s TEXT DEFAULT 'run%s';\n" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > "worker/migrations/${P}_staging_probe.sql"
          node tools/gen-baseline.js
          echo "SCHEMA_PROBE=${P}_staging_probe" >> "$GITHUB_ENV"
          echo "SCHEMA_PROBE_COLUMN=probe_${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Inject a deliberately broken schema step (gate drill only, NEVER committed)
        if: env.MODE == 'gate-drill'
        run: |
          printf -- "-- gate drill only: never committed\nTHIS IS NOT SQL;\n" > worker/migrations/0990_gate_drill_broken.sql
          node tools/gen-baseline.js

      - name: Deploy staging's Worker
        working-directory: worker
        run: |
          npm ci
          wrangler deploy --config wrangler.staging.toml --var GIT_SHA:$GITHUB_SHA

      - name: Set staging's secrets
        working-directory: worker
        run: |
          printf '%s' "$STAGING_ADMIN_KEY" | wrangler secret put ADMIN_KEY --config wrangler.staging.toml
          printf '%s' "$STAGING_CONFIRM_KEY" | wrangler secret put ADMIN_CONFIRM_KEY --config wrangler.staging.toml
          printf '%s' "$STAGING_SESSION_SECRET" | wrangler secret put SESSION_SECRET --config wrangler.staging.toml
          printf '%s' "${{ secrets.GOOGLE_CLIENT_ID }}" | wrangler secret put GOOGLE_CLIENT_ID --config wrangler.staging.toml
          printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRET }}" | wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.staging.toml

      - name: Smoke test staging
        id: smoke
        continue-on-error: true
        env:
          SMOKE_RETRIES: "24"
          SMOKE_DELAY: "10"
        run: bash tools/smoke-test.sh https://${SLUG}.websitehub.co.za

      - name: Create two businesses in the shared directory
        id: businesses
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          make_business() {
            CODE=000
            for attempt in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/debug/directory/create-business" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "Content-Type: application/json" -d "{\"id\":\"$1\",\"name\":\"$2\",\"owner_email\":\"$3\"}")
              if [ "$CODE" = "200" ]; then break; fi
              sleep 6
            done
            echo "$CODE"
          }
          ONE=$(make_business staging-co "Staging Company" staging-owner@example.com)
          TWO=$(make_business staging-two "Second Staging Company" staging-two-owner@example.com)
          printf '{"staging-co": "%s", "staging-two": "%s"}' "$ONE" "$TWO" > "$RESULTS/businesses.json"

      - name: Set up staging's schema and indexes
        id: init
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          : > "$RESULTS/init.txt"
          # A new version and its secrets take a moment to reach every Cloudflare location (found live: the first run had 3 of 38 routes answer 404 or 401, and the second run
          # had none), so each route is retried a few times before a failure is recorded.
          for route in $(grep -oE 'POST /debug/init-[a-z0-9-]+' worker/src/admin-routes.ts | sed 's/POST //' | grep -v 'init-indexes'); do
            CODE=000
            for attempt in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" "$BASE$route")
              if [ "$CODE" = "200" ]; then break; fi
              sleep 6
            done
            echo "$route $CODE" >> "$RESULTS/init.txt"
          done
          curl -s -X POST -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: staging-co" "$BASE/debug/init-indexes" > "$RESULTS/indexes.json"

      - name: Gate - check that every business object applied the real schema steps
        id: gate
        if: env.MODE == 'gate' || env.MODE == 'gate-drill'
        continue-on-error: true
        run: |
          BASE="https://${SLUG}.websitehub.co.za"
          # The newest step number the candidate code knows: the objects must reach it. (Existing objects can keep running the PREVIOUS code for a few minutes after a deploy, so wait for them.)
          EXPECTED=$(ls worker/migrations/*.sql | sed -E 's#.*/([0-9]{4})_.*#\1#' | sort | tail -1 | sed -E 's/^0+//')
          echo "the candidate code's newest schema step: $EXPECTED"
          for b in staging-co staging-two; do
            for attempt in $(seq 1 24); do
              curl -s "$BASE/admin/health" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Target-Business: $b" > "$RESULTS/gate-health-$b.json"
              python3 -c "import json,sys; d=json.load(open('$RESULTS/gate-health-$b.json')); sys.exit(0 if (d.get('schema') or {}).get('latestKnownStep') == $EXPECTED else 1)" 2>/dev/null && break
              sleep 15
            done
            curl -s "$BASE/admin/migration/manifest" -H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $b" > "$RESULTS/gate-after-$b.json"
          done
          python3 tools/gate-judge.py "$RESULTS" "$EXPECTED" gate

      - name: Gate verdict
        if: env.MODE == 'gate'
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          verdict = json.load(open(os.path.join(os.environ["RESULTS"], "gate.json")))
          problems = list(verdict.get("problems") or [])
          if os.environ.get("SMOKE") != "success":
              problems.append("the staging smoke test did not pass")
          if os.environ.get("GATE") != "success":
              problems.append("the gate check itself did not complete")
          if problems:
              print("THE STAGING GATE FAILED. Production is NOT deployed.")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("The staging gate passed: every business object applied the real schema steps and nothing was lost.")
          PY

      - name: Memory ramp (mode ramp, staging-two only, one table grown in steps with a snapshot and a restore tried at each size)
        if: env.MODE == 'ramp'
        env:
          RAMP_SIZES: ${{ inputs.ramp_sizes }}
        run: |
          # The question: how large a single table can a real Durable Object snapshot and restore before it runs out of memory (the limit is 128 MB; the 2026-10-28 failure was about size)? The deploy above has put this branch's code, with the
          # staging-only ramp routes, on staging. For each size the table is topped up with marker rows (POST /admin/engine/ramp), a snapshot is taken (POST /admin/backup/run), and that snapshot is restored (POST /admin/backup/restore, which takes its
          # own safety snapshot first). The first failure ends the ramp: a failure is a RESULT, not a failed run. Every call is logged with its HTTP status and seconds, and the marker rows are ALWAYS cleared afterwards. Never production, never any business but staging-two.
          set +e
          BASE="https://${SLUG}.websitehub.co.za"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY")
          B=staging-two
          mkdir -p "$RESULTS"
          : > "$RESULTS/ramp-log.tsv"
          call() { name=$1; out=$2; shift 2; R=$(curl -s --max-time 590 -o "$out" -w '%{http_code}\t%{time_total}' "$@"); rc=$?; printf '%s\t%s\t%s\n' "$name" "$R" "$rc" | tee -a "$RESULTS/ramp-log.tsv"; }
          bcall() { name=$1; out=$2; shift 2; call "$name" "$out" "${A[@]}" -H "X-Target-Business: $B" "$@"; }
          bcall start-status "$RESULTS/ramp-start-status.json" "$BASE/admin/backup/status"
          bcall start-engine "$RESULTS/ramp-start-engine.json" "$BASE/admin/engine/status"
          STOP=0
          SIZES="${RAMP_SIZES:-20000 40000 80000 120000 160000}"
          # The sizes come from a person's input: only digits and spaces, each between 1 and 2000000, in ascending order. Anything else and the ramp does not start.
          PREV=0
          for N in $SIZES; do
            case "$N" in ''|*[!0-9]*) echo "bad ramp size: $N"; SIZES=""; break;; esac
            if [ "$N" -le "$PREV" ] || [ "$N" -gt 2000000 ]; then echo "bad ramp size order or range: $N"; SIZES=""; break; fi
            PREV=$N
          done
          echo "ramp sizes: ${SIZES:-NONE}"
          for N in $SIZES; do
            [ "$STOP" = 1 ] && break
            bcall "ramp-$N" "$RESULTS/ramp-$N.json" -X POST -H "Content-Type: application/json" -d "{\"confirm\":\"$B\",\"rows\":$N}" "$BASE/admin/engine/ramp"
            bcall "snapshot-$N" "$RESULTS/snapshot-$N.json" -X POST "$BASE/admin/backup/run"
            SNAP=$(sed -n 's/.*"snapshot" *: *"\([^"]*\)".*/\1/p' "$RESULTS/snapshot-$N.json" 2>/dev/null | head -n 1)
            if [ -z "$SNAP" ]; then echo "no snapshot name at $N rows: the ramp stops here"; STOP=1; break; fi
            bcall "restore-$N" "$RESULTS/restore-$N.json" -X POST -H "Content-Type: application/json" -d "{\"snapshot\":\"$SNAP\",\"confirm\":\"$B\"}" "$BASE/admin/backup/restore"
            bcall "health-$N" "$RESULTS/health-$N.json" "$BASE/admin/health"
            if ! grep -q '"ok" *: *true' "$RESULTS/restore-$N.json" 2>/dev/null; then echo "the restore at $N rows did not report ok: the ramp stops here"; STOP=1; fi
          done
          bcall clear "$RESULTS/ramp-clear.json" -X POST -H "Content-Type: application/json" -d "{\"confirm\":\"$B\"}" "$BASE/admin/engine/ramp-clear"
          bcall final-health "$RESULTS/ramp-final-health.json" "$BASE/admin/health"
          bcall final-engine "$RESULTS/ramp-final-engine.json" "$BASE/admin/engine/status"
          bcall final-status "$RESULTS/ramp-final-status.json" "$BASE/admin/backup/status"
          python3 tools/ramp-summary.py "$RESULTS" "${{ github.sha }}" > "$RESULTS/ramp-summary.json"
          mkdir -p ops
          cp "$RESULTS/ramp-summary.json" ops/staging-ramp-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git checkout -- worker/src/schema-steps.ts worker/src/baseline-sql.ts 2>/dev/null
          git add ops/staging-ramp-last.json
          git commit -m "Staging memory ramp record (sizes, HTTP statuses, seconds and results only)" || echo "nothing to record"
          PUSHRC=1
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && { PUSHRC=0; break; }
            sleep 3
          done
          echo "ramp record pushed: rc=$PUSHRC"
          exit $PUSHRC

      - name: Customers and suppliers proof (mode parties-proof, the dedicated staging business staging-parties only)
        if: env.MODE == 'parties-proof'
        run: |
          # docs/decisions/customers-suppliers.md, "Next for this capability" item 1. Proves party.create, party.edit and parties.find on a REAL Durable Object, through the real routes, signed in as that business's owner (and an
          # installer, who must be refused). It uses its OWN business (staging-parties, never staging-two or staging-co, whose state other steps depend on), is safe to re-run (every name carries this run's id, and it only
          # provisions an engine-EMPTY object), approves only the party actions it proposes itself, and never touches money. Staging only; never production.
          set +e
          BASE="https://${SLUG}.websitehub.co.za"
          B=staging-parties
          RUN="${{ github.run_id }}"
          A=(-H "X-Admin-Key: $STAGING_ADMIN_KEY" -H "X-Admin-Confirm: $STAGING_CONFIRM_KEY" -H "X-Target-Business: $B")
