name: App compile check

# Compiles the REAL app (flutter analyze, then flutter build web) on every branch EXCEPT main, and deploys nothing. Why: a push to main starts a Codemagic release build and a web preview deploy, so a Dart mistake that is only
# found there blocks everything waiting in the build. Nothing else in CI looked at the app at all, and the tools Claude works with cannot reach a Dart SDK, so until now new app code was checked for syntax only.
# It builds exactly as deploy-web-preview.yml does (same scaffolding), so "it compiles here" means "the preview deploy will compile it". Errors fail the job; infos and warnings (there are many in the existing app) do not.
on:
  push:
    branches-ignore: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-compile-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bootstrap web scaffolding (same as the preview deploy)
        run: |
          cd app
          if [ ! -d "web" ]; then
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            cp lib/main.dart /tmp/main.dart.bak
            flutter create --platforms=web --org za.co.websitehub --project-name the_office .
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            cp /tmp/main.dart.bak lib/main.dart
          fi
          cp auth-callback-template.html web/auth-callback.html

      - name: Get packages
        run: |
          cd app
          flutter pub get

      - name: Analyze (errors fail; infos and warnings are listed)
        id: analyze
        shell: bash
        run: |
          cd app
          # Only lib/: the scaffolding step runs `flutter create`, which adds a sample test (test/widget_test.dart) that refers to a class this app does not have. That is an artefact of CI, not the app.
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          echo "ERROR_COUNT=$(grep -c '^ *error •' /tmp/analyze.txt || true)"

      - name: Tests (flutter test: the app's automated tests)
        id: tests
        shell: bash
        run: |
          cd app
          flutter test 2>&1 | tee /tmp/test.txt
          exit ${PIPESTATUS[0]}

      - name: Compile for web
        id: build
        run: |
          cd app
          flutter build web --release

      # A result that can be READ, not just a green or red mark: GitHub's own run status can lag or stay "queued" after a run has finished. The record holds the commit, each step's outcome, the analyzer's error lines and the tail of the test output
      # (no secrets, nothing else), and is committed back to the branch by the workflow's own identity (a push made with the workflow token does not start another run).
      - name: Record the result
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import datetime, json, os, re
          def read(path):
              try: return open(path, encoding="utf-8", errors="replace").read().splitlines()
              except Exception: return []
          analyze, tests = read("/tmp/analyze.txt"), read("/tmp/test.txt")
          errors = [l.strip()[:200] for l in analyze if re.match(r"^\s*error •", l)]
          out = {"commit": os.environ["GITHUB_SHA"][:7], "when": datetime.datetime.now(datetime.timezone.utc).isoformat(), "analyze": os.environ["ANALYZE"], "analyze_errors": len(errors), "analyze_error_lines": errors[:8], "tests": os.environ["TESTS"], "test_tail": [l.strip()[:200] for l in tests[-14:]], "build": os.environ["BUILD"]}
          json.dump(out, open("ops/app-compile-last.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY

      - name: Commit the record
        if: always()
        run: |
          git config user.name "app-compile-workflow"
          git config user.email "noreply@github.com"
          git add ops/app-compile-last.json || true
          git commit -m "App compile record (commit, step outcomes, analyzer errors and test tail only)" || echo "nothing to record"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME" || echo "could not push the record"
