name: Deploy office-api

# SHIP_CHECKLIST.md item 5. Three changes from the old pipeline:
#   1. The tests run on EVERY push to main. They used to run only when a file under worker/ changed, so a change to the tests, the recordings or the route policy
#      was never checked by CI at all.
#   2. The Worker is deployed only when the Worker itself changed (or this file did, or a person asked).
#   3. After a deploy a smoke test checks the LIVE Worker. If it fails, the previous version is restored automatically and the run is marked failed.
#   4. THE STAGING GATE (item 8). A push that changes a MIGRATION file (worker/migrations/NNNN_*.sql) must first pass the staging gate: the candidate code, with the real steps, is deployed to staging and
#      every staging business object must apply them with nothing failed, nothing pending and no rows lost. If the gate fails the deploy job does not run and production stays as it was. Every other push
#      skips the gate. A manual run is never gated (a person asked for exactly that deploy).
# A manual run with "drill" ticked proves the rollback works: it deploys the same code, forces the smoke test to fail, and shows the rollback and a healthy Worker
# afterwards (production ends on identical code, so nothing is at risk).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drill:
        description: "Rollback drill: deploy, force the smoke test to fail, prove the automatic rollback works"
        type: boolean
        default: false

concurrency:
  group: deploy-office-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.changes.outputs.deploy_needed }}
      migrations_changed: ${{ steps.changes.outputs.migrations_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      # What matters is what PRODUCTION is running, not what the previous commit on main was: the previous commit may have failed its tests and never deployed (2026-10-17: a tests-only fix after a red run skipped the deploy and left a
      # Worker change, and would have left a migration's staging gate, undone). The deploy stamps its commit into the Worker and /health reports it; "unknown" means "deploy, and rehearse any migration".
      - name: Which commit is production running?
        id: running
        run: echo "base=$(bash tools/deployed-base.sh "$GITHUB_SHA" https://office.websitehub.co.za)" >> "$GITHUB_OUTPUT"

      - name: Documentation check
        run: node tools/docs-check.js
        env:
          # the same base the pipeline uses for everything else: what PRODUCTION is running (never github.event.before, which is unreliable: tools/deploy-base.test.js holds that)
          DOCS_CHECK_BASE: ${{ steps.running.outputs.base }}

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Role-matrix test
        run: node tools/role-matrix.test.js
        env:
          NODE_PATH: worker/node_modules

      - name: Role-matrix test on the Durable Object adapter, with every index applied
        run: node tools/role-matrix.test.js
        env:
          NODE_PATH: worker/node_modules
          HARNESS_BACKEND: do
          HARNESS_INDEXES: "1"

      - name: Did the Worker change?
        id: changes
        env:
          BASE: ${{ steps.running.outputs.base }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "migrations_changed=$(bash tools/migrations-changed.sh "$BASE" "$GITHUB_SHA" "$EVENT")" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(worker/|\.github/workflows/deploy\.yml$)'; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo "Only tests or documents changed: nothing to deploy."
          fi

  # The staging gate: runs only when a migration file changed. It is the staging workflow in "gate" mode (provision, deploy the candidate, check every business object), called as a job.
  gate:
    needs: test
    if: needs.test.outputs.migrations_changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/staging.yml
    with:
      mode: gate
    secrets: inherit

  deploy:
    needs: [test, gate]
    # The gate either passed or was not needed (skipped). A FAILED or cancelled gate stops the deploy.
    if: ${{ always() && needs.test.result == 'success' && needs.test.outputs.deploy_needed == 'true' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var GIT_SHA:${{ github.sha }}

      - name: Smoke test the live Worker
        id: smoke
        continue-on-error: true
        env:
          FORCE_FAIL: ${{ github.event.inputs.drill == 'true' && '1' || '0' }}
        run: bash tools/smoke-test.sh https://office.websitehub.co.za

      - name: Roll back to the previous version
        if: steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: 'rollback --message "Automatic rollback after a failed smoke test" --yes'

      - name: Smoke test again after the rollback
        if: steps.smoke.outcome == 'failure'
        run: bash tools/smoke-test.sh https://office.websitehub.co.za

      - name: Mark the run failed (the deploy was rolled back)
        if: steps.smoke.outcome == 'failure' && github.event.inputs.drill != 'true'
        run: |
          echo "The new version failed its smoke test and was rolled back. Production is on the previous version. Fix the cause and push again."
          exit 1

      - name: Drill result
        if: steps.smoke.outcome == 'failure' && github.event.inputs.drill == 'true'
        run: echo "DRILL PASSED. The smoke test failed on purpose, the automatic rollback ran, and the Worker is healthy again."
