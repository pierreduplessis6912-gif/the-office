name: Staging Moonshot key (set or remove)

# Puts the repo secret MOONSHOT_API__KEY into the STAGING Worker (office-staging-api) as a Worker secret named MOONSHOT_API_KEY, or removes it. Never production, never printed. The key must be set BEFORE the staging deploy so the
# Worker's business objects start with it. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "set, remove or verify (verify lists only whether the secret NAME is configured on the staging Worker)"
        required: true
        default: "set"

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API__KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - name: Set or remove the staging Worker secret
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          act = os.environ["ACTION"]; acct = os.environ["CLOUDFLARE_ACCOUNT_ID"]; tok = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts/office-staging-api/secrets"
          if act == "verify":
              req = urllib.request.Request(base, method="GET", headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: names = sorted(x.get("name") for x in json.loads(r.read().decode()).get("result", []))
              except urllib.error.HTTPError as e: print("verify status", e.code); sys.exit(1)
              print("MOONSHOT_API_KEY configured on the staging Worker:", "MOONSHOT_API_KEY" in names, "| secret names:", names)
              import time; open("staging-moonshot-key-last.json", "w").write(json.dumps({"when": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "worker": "office-staging-api", "moonshot_api_key_configured": "MOONSHOT_API_KEY" in names, "secret_names": names}, indent=1) + "\n"); sys.exit(0)
          if act == "set":
              key = os.environ.get("MOONSHOT_API_KEY", "")
              if not key: print("no key in the repo secret"); sys.exit(1)
              req = urllib.request.Request(base, data=json.dumps({"name": "MOONSHOT_API_KEY", "text": key, "type": "secret_text"}).encode(), method="PUT", headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
          else:
              req = urllib.request.Request(base + "/MOONSHOT_API_KEY", method="DELETE", headers={"Authorization": "Bearer " + tok})
          try:
              with urllib.request.urlopen(req, timeout=60) as r: print(act, "status", r.status)
          except urllib.error.HTTPError as e: print(act, "status", e.code); sys.exit(1)
          PY
      - name: Record the verification (secret names and a true or false only; never a value)
        if: ${{ inputs.action == 'verify' }}
        run: |
          mkdir -p ops
          cp staging-moonshot-key-last.json ops/staging-moonshot-key-last.json
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add ops/staging-moonshot-key-last.json
          git commit -q -m "Staging Moonshot key verification record (secret names only)" || true
          git pull -q --rebase origin main && git push -q origin HEAD:main
