name: Staging object identity check (read only)
# business-object.ts refuses a claim that does not match the name an object was addressed by, but only if the production RUNTIME tells the object that name, which cannot be known from the code. This reads /admin/health on the two real STAGING
# business objects (the Durable Objects behind staging-co and staging-two) and records what they report: object.name and object.identityVisible (tools/staging-identity.py). It is READ ONLY: it only issues GET requests, deploys nothing, sets no secret, holds no
# Cloudflare token and prints no key (the admin key is derived from STAGING_KEY_SEED, as staging.yml derives it). It records to ops/staging-identity-last.json on the BRANCH it ran on, never on main (a push to main deploys production).
# Started by hand only. Staging must already run the commit under test: dispatch staging.yml (mode gate) on the branch first; this refuses to read anything if staging runs another commit.
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "The full commit staging must be running (the run stops, reading no object, if /health says otherwise)"
        required: true
concurrency:
  group: staging-identity
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED: ${{ secrets.STAGING_KEY_SEED }}
      EXPECT_COMMIT: ${{ inputs.expect_commit }}
      OUT: ${{ github.workspace }}/staging-identity-result.json
    steps:
      - uses: actions/checkout@v4
      - name: Read each staging business object's identity
        id: run
        continue-on-error: true
        run: python3 tools/staging-identity.py
      - name: Record the result on this branch
        run: |
          mkdir -p ops
          cp "$OUT" ops/staging-identity-last.json
          git config user.name "staging-workflow"
          git config user.email "noreply@github.com"
          git add ops/staging-identity-last.json
          git commit -q -m "Staging object identity check record (read only: what the real staging objects report about their own name)" || true
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Fail the run if the check did not give a safe answer
        if: steps.run.outcome != 'success'
        run: exit 1
