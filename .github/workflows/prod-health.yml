name: Production health (every few hours, and on demand)

# SHIP_CHECKLIST.md item 7. The ALERT for everything that must happen on its own, with nobody watching. Every three hours it READS the business's health report (/admin/health) and goes RED (so GitHub emails
# the owner) if: the hourly memory job FAILED or has not run for too long, its next run is overdue (the alarm is stuck), the memory queue is backing up, server errors are rising, or the backups are unhealthy.
# A high model bill is reported as a WARNING (it does not turn the check red: a cap is a separate decision). READ-ONLY: one GET. The record (a verdict and counts, committed only for a manual run) holds no names.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

concurrency:
  group: prod-health
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://office.websitehub.co.za
      BUSINESS: zululand-flooring-and-blinds
      JOB_STALE_MINUTES: "150"
      ALARM_OVERDUE_MINUTES: "30"
      QUEUE_OLDEST_MINUTES: "180"
      QUEUE_MAX: "500"
      ERROR_RATE_LIMIT: "0.2"
      ERROR_MIN_REQUESTS: "20"
      BACKUP_STALE_HOURS: "30"
      SPEND_WARN_USD: "2"
      CAP_WARN_FRACTION: "0.8"
      # The South African data centres. The object's own data centre (health report: location.colo) is compared with them; being elsewhere is a WARNING, never a failure (it costs every request a long hop, it breaks nothing).
      # The data centre is judged, NOT the country the trace reports: that is where the request's address is placed, and a Paris data centre reported "US".
      EXPECTED_OBJECT_COLOS: "JNB,CPT,DUR"
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4

      - name: Read the health report (reads only)
        env:
          ADMIN: ${{ secrets.PROD_ADMIN_KEY }}
        run: |
          mkdir -p "$RESULTS"
          curl -s "$PROD_URL/admin/health" -H "X-Admin-Key: $ADMIN" -H "X-Target-Business: $BUSINESS" > "$RESULTS/health.json"
          python3 -c "import json; d=json.load(open('$RESULTS/health.json')); print(json.dumps({**{k: d.get(k) for k in ('business', 'hourlyJob', 'memoryQueue', 'requests', 'backup', 'limits', 'location')}, 'modelToday': (d.get('model') or {}).get('today')}, indent=1))" || cat "$RESULTS/health.json"

      - name: Judge the health report
        id: judge
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          r = os.environ["RESULTS"]
          try:
              h = json.load(open(os.path.join(r, "health.json")))
          except Exception:
              h = {}
          env = os.environ
          problems, warnings = [], []
          def when(s):
              try:
                  return datetime.fromisoformat(str(s).replace("Z", "+00:00"))
              except Exception:
                  return None
          if not isinstance(h, dict) or not h.get("business"):
              problems.append("the health report could not be read")
              h = {}
          now = when(h.get("generatedAt"))
          job = h.get("hourlyJob") or {}
          if job.get("lastOk") is False:
              problems.append("the last hourly job FAILED: %s" % job.get("lastError"))
          minutes = job.get("minutesSinceLastRun")
          if minutes is None:
              if not job.get("nextAlarmAt"):
                  problems.append("the hourly job has never run and no run is scheduled")
          elif minutes > float(env["JOB_STALE_MINUTES"]):
              problems.append("the hourly job last ran %s minutes ago (limit %s)" % (minutes, env["JOB_STALE_MINUTES"]))
          nxt = when(job.get("nextAlarmAt"))
          if nxt and now and (now - nxt).total_seconds() / 60 > float(env["ALARM_OVERDUE_MINUTES"]):
              problems.append("the next hourly run is overdue by %d minutes (the alarm may be stuck)" % ((now - nxt).total_seconds() / 60))
          q = h.get("memoryQueue") or {}
          if (q.get("oldestPendingMinutes") or 0) > float(env["QUEUE_OLDEST_MINUTES"]):
              problems.append("the oldest memory has waited %s minutes to be saved (limit %s)" % (q.get("oldestPendingMinutes"), env["QUEUE_OLDEST_MINUTES"]))
          if (q.get("pending") or 0) > int(env["QUEUE_MAX"]):
              problems.append("%s memories are waiting to be saved (limit %s)" % (q.get("pending"), env["QUEUE_MAX"]))
          rq = h.get("requests") or {}
          if (rq.get("recent") or 0) >= int(env["ERROR_MIN_REQUESTS"]) and (rq.get("errorRate") or 0) > float(env["ERROR_RATE_LIMIT"]):
              problems.append("server errors are %s of the last %s requests (limit %s)" % (rq.get("errorRate"), rq.get("recent"), env["ERROR_RATE_LIMIT"]))
          b = h.get("backup") or {}
          if b.get("lastAttemptOk") is False:
              problems.append("the last backup attempt FAILED: %s" % b.get("lastError"))
          if b.get("newestAgeHours") is None:
              problems.append("there is no backup")
          elif b.get("newestAgeHours") > float(env["BACKUP_STALE_HOURS"]):
              problems.append("the newest backup is %s hours old (limit %s)" % (b.get("newestAgeHours"), env["BACKUP_STALE_HOURS"]))
          sch = h.get("schema") or {}
          if sch.get("error"):
              problems.append("a schema step FAILED: %s: %s (the business is refused until it is fixed)" % ((sch.get("error") or {}).get("name"), (sch.get("error") or {}).get("message")))
          elif sch.get("pending"):
              problems.append("%d schema step(s) are not applied: %s" % (len(sch.get("pending")), ", ".join(sch.get("pending"))))
          if (sch.get("unknownApplied") or 0) > 0:
              warnings.append("this business has applied %s schema step(s) this code does not know (the code may have been rolled back)" % sch.get("unknownApplied"))
          spend = ((h.get("model") or {}).get("today") or {}).get("estimatedUsd") or 0
          if spend > float(env["SPEND_WARN_USD"]):
              warnings.append("the model has cost about $%s today (warning above $%s)" % (spend, env["SPEND_WARN_USD"]))
          lim = h.get("limits") or {}
          if (lim.get("membersAtOrOverLimit") or 0) > 0:
              warnings.append("%s member(s) reached the daily message limit today (the plan allows %s each)" % (lim.get("membersAtOrOverLimit"), (lim.get("plan") or {}).get("messagesPerMemberPerDay")))
          loc = h.get("location") or {}
          expected = [c.strip() for c in (env.get("EXPECTED_OBJECT_COLOS") or "").split(",") if c.strip()]
          if expected and loc.get("colo") and loc.get("colo") not in expected:
              warnings.append("the business's object runs in the %s data centre, which is not one of the South African ones (%s): every request its members make pays that distance (SHIP_CHECKLIST.md item 13)" % (loc.get("colo"), ", ".join(expected)))
          cap = (lim.get("plan") or {}).get("neuronsPerBusinessPerDay") or 0
          used = ((h.get("model") or {}).get("today") or {}).get("neurons") or 0
          if cap and used >= cap * float(env["CAP_WARN_FRACTION"]):
              warnings.append("the model has used %d%% of the day's spend ceiling (%s of %s neurons)" % (round(100 * used / cap), used, cap))
          verdict = {"object_location": {"colo": loc.get("colo"), "country": loc.get("country"), "checked_at": loc.get("checkedAt"), "error": loc.get("error")}, "healthy": not problems, "problems": problems, "warnings": warnings, "model_today_usd": spend, "queue_pending": q.get("pending"), "job_minutes_since_last_run": minutes, "model_today_neurons": ((h.get("model") or {}).get("today") or {}).get("neurons"), "model_requests_today": ((h.get("model") or {}).get("today") or {}).get("requests"), "plan_mode": (lim.get("plan") or {}).get("mode"), "members_active_today": lim.get("activeMembers"), "members_at_or_over_limit": lim.get("membersAtOrOverLimit"), "schema_pending": len(sch.get("pending") or []), "schema_steps_applied": sch.get("appliedSteps")}
          json.dump(verdict, open(os.path.join(r, "verdict.json"), "w"))
          print(json.dumps(verdict, indent=1))
          open(os.environ["GITHUB_OUTPUT"], "a").write("healthy=%s\n" % ("true" if not problems else "false"))
          PY

      - name: Record what was found (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, datetime
          r = os.environ["RESULTS"]
          try:
              verdict = json.load(open(os.path.join(r, "verdict.json")))
          except Exception:
              verdict = None
          out = {"when": datetime.datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "business": os.environ.get("BUSINESS"), "verdict": verdict}
          json.dump(out, open("ops/production-health-last.json", "w"), indent=1)
          PY
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add ops/production-health-last.json
          git commit -m "Production health record (a verdict and counts only)" || echo "nothing to record"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Go RED if something is wrong
        if: always() && steps.judge.outputs.healthy != 'true'
        run: |
          echo "Something needs attention. See the 'Judge the health report' step."
          exit 1
