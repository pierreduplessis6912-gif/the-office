name: Set the PayFast SANDBOX secrets on the production Worker

# Copies exactly three values from this repository's GitHub secrets onto the production Worker, so a real PayFast SANDBOX test can be run (the Worker stays in sandbox mode: PAYFAST_MODE is not "live", and the production configuration file
# says nothing about PayFast). It never touches the LIVE PayFast secrets, never prints a value (only names), skips a secret that is empty, and does not deploy. Run it by hand after adding or changing the secrets in GitHub (Settings, Secrets and
# variables, Actions): PAYFAST_SANDBOX_MERCHANT_ID, PAYFAST_SANDBOX_MERCHANT_KEY and PAYFAST_SANDBOX_PASSPHRASE. Going live is a separate, deliberate step that does not exist yet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Put the sandbox secrets on the production Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYFAST_SANDBOX_MERCHANT_ID: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_ID }}
          PAYFAST_SANDBOX_MERCHANT_KEY: ${{ secrets.PAYFAST_SANDBOX_MERCHANT_KEY }}
          PAYFAST_SANDBOX_PASSPHRASE: ${{ secrets.PAYFAST_SANDBOX_PASSPHRASE }}
        run: |
          set -e
          done_names=""
          for NAME in PAYFAST_SANDBOX_MERCHANT_ID PAYFAST_SANDBOX_MERCHANT_KEY PAYFAST_SANDBOX_PASSPHRASE; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then echo "Skipping $NAME: it is empty or not set in GitHub."; continue; fi
            printf '%s' "$VALUE" | npx wrangler secret put "$NAME" > /dev/null
            done_names="$done_names $NAME"
          done
          echo "Set on the production Worker:${done_names:- (nothing)}"
          echo "The Worker is still in sandbox mode (PAYFAST_MODE is not live)."
