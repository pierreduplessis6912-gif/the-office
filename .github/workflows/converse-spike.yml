name: Conversation-first front door evaluation (staging, real model)

# Evaluates the conversation-first front door (CONVERSATIONAL_LAYER.md, "The spike as built") with the REAL model on STAGING: seeds a little staging data, runs ~30 recorded phrases with the old pipeline and then with CONVERSE_MODE=agent
# (a Worker secret on the STAGING Worker, removed at the end), and records which tools the model chose, whether replies were grounded, time per message and model calls in ops/converse-spike-last.json. Staging credentials only, never
# production; synthetic messages only. Started by hand only; staging must already run the branch under test (dispatch staging.yml on that branch first).
on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: "The full commit staging must be running (the run fails if /health says otherwise)"
        required: true

concurrency:
  group: converse-spike
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEED: ${{ secrets.STAGING_KEY_SEED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECT_COMMIT: ${{ inputs.expect_commit }}
      OUT: ${{ github.workspace }}/converse-spike-result.json
    steps:
      - uses: actions/checkout@v4
      - name: Run the smoke test
        id: run
        continue-on-error: true
        run: python3 tools/converse-spike.py
      - name: Record the result on main
        run: |
          mkdir -p ops
          cp "$OUT" ops/converse-spike-last.json
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add ops/converse-spike-last.json
          git commit -q -m "Conversation-first front door evaluation record (staging; plain facts and replies to synthetic messages)" || true
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Fail the run if the evaluation did not run
        if: steps.run.outcome != 'success'
        run: exit 1
