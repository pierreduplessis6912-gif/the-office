name: Production copy (into the business object, without the memories)

# SHIP_CHECKLIST.md item A. Copies the production business's data into its Durable Object (`zululand-flooring-and-blinds`), over HTTP, through this GitHub runner (Pierre approved the data passing through it,
# 2026-10-13), then compares fingerprints from both sides. It READS production's database and stores and WRITES only into the business's object, its prefixed notes and files, and the directory: production keeps
# serving everyone from the database, unchanged. The MEMORIES are deliberately NOT copied now: production still searches the same index with no namespace, so copies would show each memory twice until the cutover;
# they are copied inside the freeze window at cutover. The runner refuses unless the source is the single-business deployment and the target is that business's object, and refuses a target that already holds
# data. The record holds counts, steps and statuses; anything that looks like an email address is replaced. Started by hand only.
on:
  workflow_dispatch:

concurrency:
  group: prod-copy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://office.websitehub.co.za
      BUSINESS: zululand-flooring-and-blinds
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Count what is there before copying (reads only)
        env:
          SOURCE_URL: ${{ env.PROD_URL }}
          SOURCE_ADMIN_KEY: ${{ secrets.PROD_ADMIN_KEY }}
          SOURCE_CONFIRM_KEY: ${{ secrets.PROD_CONFIRM_KEY }}
        run: |
          mkdir -p "$RESULTS"
          set +e
          node tools/inventory.mjs > "$RESULTS/before.json" 2> /dev/null
          echo "exit=$?" > "$RESULTS/before.exit"

      - name: Copy the business into its object
        id: copy
        continue-on-error: true
        env:
          SOURCE_URL: ${{ env.PROD_URL }}
          SOURCE_ADMIN_KEY: ${{ secrets.PROD_ADMIN_KEY }}
          SOURCE_CONFIRM_KEY: ${{ secrets.PROD_CONFIRM_KEY }}
          TARGET_URL: ${{ env.PROD_URL }}
          TARGET_ADMIN_KEY: ${{ secrets.PROD_ADMIN_KEY }}
          TARGET_CONFIRM_KEY: ${{ secrets.PROD_CONFIRM_KEY }}
        run: |
          set +e
          node tools/migrate.mjs > "$RESULTS/report.json" 2> "$RESULTS/report.log"
          echo "exit=$?" > "$RESULTS/report.exit"
          cat "$RESULTS/report.exit"
          tail -n 12 "$RESULTS/report.log"

      - name: Check production still serves as before (reads only)
        run: |
          curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/health" > "$RESULTS/health.status"
          curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/customers" > "$RESULTS/stranger.status"

      - name: Record what happened
        if: always()
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, re, datetime
          r = os.environ["RESULTS"]
          EMAIL = re.compile(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+")
          def scrub(x):
              if isinstance(x, str):
                  return EMAIL.sub("<email>", x)
              if isinstance(x, list):
                  return [scrub(i) for i in x]
              if isinstance(x, dict):
                  return {k: scrub(v) for k, v in x.items()}
              return x
          def read(n):
              try:
                  return open(os.path.join(r, n)).read().strip()
              except Exception:
                  return None
          def readjson(n):
              t = read(n)
              try:
                  return json.loads(t) if t else None
              except Exception:
                  return None
          report = readjson("report.json") or {}
          out = {
              "when": datetime.datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7], "business": os.environ.get("BUSINESS"),
              "memories_copied": False, "before_exit": read("before.exit"),
              "before": (readjson("before.json") or {}).get("database"),
              "migration": {"ok": report.get("ok"), "exit": read("report.exit"), "seconds": round((report.get("durationMs") or 0) / 1000), "mismatches": report.get("mismatches"), "error": report.get("error"), "failed_after": report.get("failedAfter"), "steps": report.get("steps"), "log_tail": (read("report.log") or "")[-1200:]},
              "production_after": {"health": read("health.status"), "a_stranger_asking_for_customers_gets": read("stranger.status")},
          }
          json.dump(scrub(out), open("ops/production-copy-last.json", "w"), indent=1)
          PY
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add ops/production-copy-last.json
          git commit -m "Production copy record (counts, steps and statuses; addresses scrubbed)" || echo "nothing to record"
          git pull --rebase origin main
          git push origin HEAD:main
