name: Read the Cloudflare zone settings that can block an outside caller (read only)

# A diagnostic: PayFast's server could not connect to our notification address (a cURL error). This reads a handful of the zone's settings (TLS versions, IPv6, bot and challenge protection, HTTPS redirects) and records them. It only READS, prints
# no secret, and changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the zone settings
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          tok = os.environ["CF_API_TOKEN"]
          def get(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {"success": False, "errors": [{"message": "HTTP " + str(e.code)}]}
          out = {"when": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          z = get("/zones?name=websitehub.co.za")
          out["zone_lookup_ok"] = bool(z.get("success"))
          zid = ((z.get("result") or [{}])[0]).get("id")
          wanted = ["ssl", "min_tls_version", "tls_1_3", "ciphers", "ipv6", "always_use_https", "security_level", "browser_check", "challenge_ttl", "opportunistic_encryption", "http2", "http3", "automatic_https_rewrites", "waf", "ssl_recommender"]
          if zid:
              s = get(f"/zones/{zid}/settings")
              out["settings_ok"] = bool(s.get("success"))
              out["settings"] = {x["id"]: x.get("value") for x in (s.get("result") or []) if x.get("id") in wanted}
              out["settings_errors"] = [e.get("message") for e in (s.get("errors") or [])][:3]
              b = get(f"/zones/{zid}/bot_management")
              out["bot_management_ok"] = bool(b.get("success"))
              out["bot_management"] = {k: v for k, v in (b.get("result") or {}).items() if k in ("fight_mode", "enable_js", "sbfm_definitely_automated", "sbfm_likely_automated", "sbfm_verified_bots", "optimize_wordpress", "suppress_session_score")}
              out["bot_errors"] = [e.get("message") for e in (b.get("errors") or [])][:3]
              d = get(f"/zones/{zid}/dns_records?name=office.websitehub.co.za")
              out["office_dns"] = [{"type": r.get("type"), "proxied": r.get("proxied")} for r in (d.get("result") or [])]
          # What actually happened to requests for the notification address in the last day, from Cloudflare's own analytics: did anything REACH the edge, and what was done with it? (needs analytics read access; the result says if it is missing)
          def graphql(query):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps({"query": query}).encode(), headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  try: return json.load(e)
                  except Exception: return {"errors": [{"message": "HTTP " + str(e.code)}]}
          if zid:
              now = datetime.datetime.now(datetime.timezone.utc); since = (now - datetime.timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ"); until = now.strftime("%Y-%m-%dT%H:%M:%SZ")
              q1 = '{ viewer { zones(filter: {zoneTag: "%s"}) { httpRequestsAdaptiveGroups(filter: {datetime_geq: "%s", datetime_leq: "%s", clientRequestPath: "/billing/payfast/notify"}, limit: 20, orderBy: [datetime_DESC]) { count dimensions { datetime clientRequestHTTPMethodName edgeResponseStatus originResponseStatus clientAsn clientCountryName securitySource securityAction } } } } }' % (zid, since, until)
              g1 = graphql(q1); out["edge_requests_for_notify_path"] = (((g1.get("data") or {}).get("viewer") or {}).get("zones") or [{}])[0].get("httpRequestsAdaptiveGroups") if g1.get("data") else None; out["edge_requests_errors"] = [e.get("message") for e in (g1.get("errors") or [])][:3]
              q2 = '{ viewer { zones(filter: {zoneTag: "%s"}) { firewallEventsAdaptive(filter: {datetime_geq: "%s", datetime_leq: "%s", clientRequestPath: "/billing/payfast/notify"}, limit: 20, orderBy: [datetime_DESC]) { datetime action source ruleId clientAsn clientCountryName userAgent clientRequestHTTPMethodName } } } }' % (zid, since, until)
              g2 = graphql(q2); out["security_events_for_notify_path"] = (((g2.get("data") or {}).get("viewer") or {}).get("zones") or [{}])[0].get("firewallEventsAdaptive") if g2.get("data") else None; out["security_events_errors"] = [e.get("message") for e in (g2.get("errors") or [])][:3]
          os.makedirs("ops", exist_ok=True)
          json.dump(out, open("ops/zone-settings-last.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
      - name: Imitate an outside server calling the notification address (harmless garbage body, refused by our own checks)
        run: |
          mkdir -p ops; exec > >(tee ops/zone-probe-last.txt) 2>&1
          U=https://office.websitehub.co.za/billing/payfast/notify
          BODY='payment_status=COMPLETE&signature=00000000000000000000000000000000'
          probe() { # label, then the extra curl options
            L="$1"; shift
            curl -s -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}' --max-time 20 -X POST "$@" --data "$BODY" "$U" > /tmp/c.txt 2>/tmp/e.txt || true
            echo "$(printf '%-34s' "$L") HTTP $(cat /tmp/c.txt) | server: $(grep -i '^server:' /tmp/h.txt | tr -d '\r' | head -1) | cf-mitigated: $(grep -i '^cf-mitigated:' /tmp/h.txt | tr -d '\r' | head -1) | body: $(head -c 60 /tmp/b.txt | tr '\n' ' ')"
          }
          probe "default curl"
          probe "no User-Agent" -H "User-Agent:"
          probe "User-Agent PayFast" -A "PayFast ITN"
          probe "PHP-style User-Agent" -A "PHP-Curl-Class"
          probe "HTTP/1.1 explicitly" --http1.1
          probe "TLS 1.2 only" --tlsv1.2 --tls-max 1.2
          probe "TLS 1.1 only" --tlsv1.1 --tls-max 1.1
          probe "IPv4 only" -4
          probe "IPv6 only" -6
          probe "with Expect header (PHP default)" -H "Expect: 100-continue"
          probe "form content type, no charset" -H "Content-Type: application/x-www-form-urlencoded"
          probe "very short timeout (2s)" --max-time 2
          echo "--- DNS the zone publishes for the host:"; getent ahosts office.websitehub.co.za | awk '{print $1}' | sort -u | head -6
          echo "--- What the server offers, asked with openssl (client-side limits switched off):"
          for V in tls1 tls1_1 tls1_2 tls1_3; do
            R=$(echo | timeout 15 openssl s_client -connect office.websitehub.co.za:443 -servername office.websitehub.co.za -$V -cipher 'ALL:@SECLEVEL=0' 2>&1 | grep -E "^\s+Protocol  :|Protocol version|Cipher is|alert|no protocols|handshake failure" | head -3 | tr '\n' ' ')
            echo "$V -> ${R:-no answer}"
          done
          echo "--- Certificate chain presented:"
          echo | timeout 15 openssl s_client -connect office.websitehub.co.za:443 -servername office.websitehub.co.za -showcerts 2>/dev/null | grep -E "^ *[0-9] s:|^   i:|a:PKEY|Verification|Verify return" | head -14
      - name: Commit the record
        if: always()
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add ops/zone-settings-last.json ops/zone-probe-last.txt || true
          git commit -m "Zone settings read (a diagnostic; settings only, no secrets)" || echo "nothing to record"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME" || echo "could not push the record"
