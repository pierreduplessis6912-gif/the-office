name: Production copy (verify only)

# SHIP_CHECKLIST.md item A. Compares the production business's data with its copy in `zululand-flooring-and-blinds`, WRITING NOTHING anywhere: it asks both ends who they are, then compares their fingerprints
# (the runner's --verify-only). Repeatable at any time, and the check to run again immediately before a cutover. The record holds counts and statuses; anything that looks like an email address is replaced.
# Started by hand only.
on:
  workflow_dispatch:

concurrency:
  group: prod-verify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://office.websitehub.co.za
      BUSINESS: zululand-flooring-and-blinds
      RESULTS: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compare the two ends (reads only)
        env:
          SOURCE_URL: ${{ env.PROD_URL }}
          SOURCE_ADMIN_KEY: ${{ secrets.PROD_ADMIN_KEY }}
          SOURCE_CONFIRM_KEY: ${{ secrets.PROD_CONFIRM_KEY }}
          TARGET_URL: ${{ env.PROD_URL }}
          TARGET_ADMIN_KEY: ${{ secrets.PROD_ADMIN_KEY }}
          TARGET_CONFIRM_KEY: ${{ secrets.PROD_CONFIRM_KEY }}
        run: |
          mkdir -p "$RESULTS"
          set +e
          node tools/migrate.mjs --verify-only > "$RESULTS/report.json" 2> "$RESULTS/report.log"
          echo "exit=$?" > "$RESULTS/report.exit"
          cat "$RESULTS/report.exit"
          tail -n 6 "$RESULTS/report.log"

      - name: Record what was found
        if: always()
        run: |
          mkdir -p ops
          python3 - <<'PY'
          import json, os, re, datetime
          r = os.environ["RESULTS"]
          EMAIL = re.compile(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+")
          def scrub(x):
              if isinstance(x, str):
                  return EMAIL.sub("<email>", x)
              if isinstance(x, list):
                  return [scrub(i) for i in x]
              if isinstance(x, dict):
                  return {k: scrub(v) for k, v in x.items()}
              return x
          def read(n):
              try:
                  return open(os.path.join(r, n)).read().strip()
              except Exception:
                  return None
          def readjson(n):
              t = read(n)
              try:
                  return json.loads(t) if t else None
              except Exception:
                  return None
          report = readjson("report.json") or {}
          out = {
              "when": datetime.datetime.utcnow().isoformat() + "Z", "run": os.environ.get("GITHUB_RUN_ID"), "commit": os.environ.get("GITHUB_SHA", "")[:7], "business": os.environ.get("BUSINESS"),
              "wrote_anything": False,
              "verification": {"ok": report.get("ok"), "exit": read("report.exit"), "seconds": round((report.get("durationMs") or 0) / 1000), "mismatches": report.get("mismatches"), "error": report.get("error"), "steps": report.get("steps"), "log_tail": (read("report.log") or "")[-600:]},
          }
          json.dump(scrub(out), open("ops/production-verify-last.json", "w"), indent=1)
          PY
          git config user.name "production-workflow"
          git config user.email "noreply@github.com"
          git add ops/production-verify-last.json
          git commit -m "Production verification record (counts and statuses; addresses scrubbed)" || echo "nothing to record"
          git pull --rebase origin main
          git push origin HEAD:main
