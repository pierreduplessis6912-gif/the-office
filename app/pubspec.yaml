name: the_office
description: The Office — native client (first client of the Office API)
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  speech_to_text: ^7.4.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_web_auth_2: ^5.0.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Real, precise fix, found live via path_provider_android's own
# changelog: 2.2.22 is the last version before it switched build files
# to Kotlin DSL (2.2.23) and then added a real jni dependency (2.3.0)
# - jni's own Android build.gradle has a genuine, confirmed Gradle DSL
# incompatibility ("Could not find method kotlin()") with this
# project's generated Android setup. Pinned here rather than fighting
# that incompatibility directly, since path_provider itself only
# needs a stable file-path API, not JNI.
dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
